<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QDCS-lite｜學生作答版</title>
<style>
/* QDCS-lite — clean color-card layout (HK TC) */
:root {
  --bg: #f0f2f5;
  --ink: #1a2332;
  --muted: #5a6a7a;
  --card: #fff;
  --border: #d8dee6;
  --radius: 12px;
  --shadow: 0 1px 4px rgba(26,35,50,.06);
  --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Heiti TC", "Segoe UI", sans-serif;
  /* Section colors */
  --blue: #1565c0;
  --blue-bg: #e8f1fb;
  --blue-border: #90caf9;
  --green: #2e7d32;
  --green-bg: #e8f5e9;
  --green-border: #a5d6a7;
  --amber: #b8860b;
  --amber-bg: #fff8e6;
  --amber-border: #e8d48a;
  --purple: #6a1b9a;
  --purple-bg: #f3e5f5;
  --purple-border: #ce93d8;
  --ok: #2e7d32;
  --ok-bg: #e8f5e9;
  --danger: #c62828;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  line-height: 1.5;
  font-size: 15px;
}
.wrap { max-width: 880px; margin: 0 auto; padding: 14px 12px 48px; }
a { color: var(--blue); }

header.app-header {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
}
header.app-header h1 { margin: 0 0 4px; font-size: 1.2rem; font-weight: 700; }
header.app-header .sub { margin: 0; color: var(--muted); font-size: .85rem; }
.badge-lite {
  display: inline-block;
  background: #eee;
  color: var(--muted);
  padding: 1px 7px;
  border-radius: 4px;
  font-size: .72rem;
  margin-left: 6px;
  vertical-align: middle;
  font-weight: 600;
}

/* Color legend */
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 12px;
  font-size: .8rem;
}
.legend span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 4px 10px;
}
.legend i {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
}
.legend i.blue { background: var(--blue); }
.legend i.green { background: var(--green); }
.legend i.amber { background: var(--amber); }
.legend i.purple { background: var(--purple); }

.assumption {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 12px;
  margin-bottom: 12px;
  font-size: .8rem;
  color: var(--muted);
}

.nav-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 12px;
}
.nav-btn, .btn {
  border: 1px solid var(--border);
  background: #fff;
  border-radius: 8px;
  cursor: pointer;
  font-family: inherit;
  font-size: .86rem;
  font-weight: 600;
  color: var(--ink);
  padding: 8px 12px;
}
.nav-btn:hover, .btn:hover { filter: brightness(.97); }
.nav-btn.active { color: #fff; border-color: transparent; }
.nav-btn[data-panel="home"].active { background: #455a64; }
.nav-btn[data-panel="teacher"].active,
.nav-btn[data-panel="import"].active { background: var(--blue); }
.nav-btn[data-panel="student"].active { background: var(--green); }
.nav-btn[data-panel="analytics"].active { background: var(--amber); color: #1a2332; }
.nav-btn[data-panel="drive"].active { background: var(--purple); }

.btn-primary { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn-success { background: var(--green); border-color: var(--green); color: #fff; }
.btn-amber { background: var(--amber); border-color: var(--amber); color: #1a2332; }
.btn-purple { background: var(--purple); border-color: var(--purple); color: #fff; }
.btn-danger { background: #fff; border-color: var(--danger); color: var(--danger); }
.btn-sm { padding: 5px 9px; font-size: .8rem; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.panel { display: none; }
.panel.active { display: block; }

/* Colored section cards */
.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  border-left-width: 5px;
}
.card h2 {
  margin: 0 0 8px;
  font-size: 1.05rem;
  display: flex;
  align-items: center;
  gap: 8px;
}
.card h3 { margin: 12px 0 6px; font-size: .95rem; }
.card.tone-blue { border-left-color: var(--blue); background: linear-gradient(90deg, var(--blue-bg) 0%, #fff 48%); }
.card.tone-blue h2 { color: var(--blue); }
.card.tone-green { border-left-color: var(--green); background: linear-gradient(90deg, var(--green-bg) 0%, #fff 48%); }
.card.tone-green h2 { color: var(--green); }
.card.tone-amber { border-left-color: var(--amber); background: linear-gradient(90deg, var(--amber-bg) 0%, #fff 48%); }
.card.tone-amber h2 { color: #8a6d00; }
.card.tone-purple { border-left-color: var(--purple); background: linear-gradient(90deg, var(--purple-bg) 0%, #fff 48%); }
.card.tone-purple h2 { color: var(--purple); }
.card.tone-neutral { border-left-color: #90a4ae; }

.dot {
  width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex-shrink: 0;
}
.dot.blue { background: var(--blue); }
.dot.green { background: var(--green); }
.dot.amber { background: var(--amber); }
.dot.purple { background: var(--purple); }

.muted { color: var(--muted); font-size: .84rem; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } }

label.field {
  display: block;
  margin-bottom: 8px;
  font-size: .84rem;
  font-weight: 600;
}
label.field input, label.field select, label.field textarea,
.field-input, .field-select, .field-textarea {
  display: block;
  width: 100%;
  margin-top: 3px;
  padding: 7px 9px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-family: inherit;
  font-size: .9rem;
  font-weight: 400;
  background: #fff;
}
textarea { min-height: 72px; resize: vertical; }

.q-block {
  border: 1px solid var(--blue-border);
  border-radius: 8px;
  padding: 10px;
  margin-bottom: 10px;
  background: #fff;
}
.q-block .q-head {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  margin-bottom: 6px;
}
.q-block .q-num {
  background: var(--blue-bg);
  color: var(--blue);
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 4px;
  font-size: .8rem;
}
.opt-row { display: flex; gap: 6px; align-items: center; margin-bottom: 5px; }
.opt-row input[type="text"] { flex: 1; }

.share-box {
  background: var(--blue-bg);
  border: 1px dashed var(--blue);
  border-radius: 8px;
  padding: 10px;
  margin-top: 8px;
  word-break: break-all;
  font-size: .88rem;
}
.share-box code { background: #fff; padding: 1px 5px; border-radius: 3px; }

.table-wrap { overflow-x: auto; }
table.scores { width: 100%; border-collapse: collapse; font-size: .84rem; background: #fff; }
table.scores th, table.scores td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; }
table.scores th { background: var(--amber-bg); }

.chart-wrap {
  background: #fff;
  border: 1px solid var(--amber-border);
  border-radius: 8px;
  padding: 10px;
  margin: 10px 0;
}
.chart-wrap canvas { max-width: 100%; display: block; margin: 0 auto; }

.stat-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.stat-pill {
  background: #fff;
  border: 1px solid var(--amber-border);
  border-radius: 8px;
  padding: 8px 12px;
  min-width: 100px;
}
.stat-pill .val { font-size: 1.25rem; font-weight: 700; color: #8a6d00; }
.stat-pill .lbl { font-size: .72rem; color: var(--muted); }

.student-q {
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--green-border);
}
.student-q .stem { font-weight: 600; margin-bottom: 6px; }
.choice-label {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  padding: 7px 9px;
  border: 1px solid var(--border);
  border-radius: 6px;
  margin-bottom: 5px;
  cursor: pointer;
  background: #fff;
}
.choice-label:hover { border-color: var(--green); }
.choice-label.correct-mark { background: var(--ok-bg); border-color: var(--ok); }
.choice-label.wrong-mark { background: #ffebee; border-color: var(--danger); }

.result-banner {
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 12px;
  font-weight: 600;
}
.result-banner.pass { background: var(--ok-bg); color: var(--ok); border: 1px solid #a5d6a7; }
.result-banner.review { background: var(--amber-bg); color: #5c4a1a; border: 1px solid var(--amber-border); }

.quiz-list-item {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
}
.quiz-list-item:last-child { border-bottom: none; }

.tag {
  display: inline-block;
  font-size: .7rem;
  padding: 1px 5px;
  border-radius: 3px;
  background: #eee;
  color: var(--muted);
  margin-left: 3px;
}
.tag.mcq { background: #e3f2fd; color: #1565c0; }
.tag.tf { background: #f3e5f5; color: #7b1fa2; }
.tag.fill { background: #fff3e0; color: #e65100; }
.tag.sa { background: #e8f5e9; color: #2e7d32; }

.import-preview {
  max-height: 240px;
  overflow-y: auto;
  background: #fff;
  border: 1px solid var(--blue-border);
  border-radius: 6px;
  padding: 8px;
  font-size: .82rem;
  white-space: pre-wrap;
}

.drive-hint {
  background: #fff;
  border: 1px solid var(--purple-border);
  border-radius: 8px;
  padding: 10px;
  font-size: .84rem;
  margin: 8px 0;
}
.drive-hint code { background: var(--purple-bg); padding: 1px 5px; border-radius: 3px; word-break: break-all; }

.flex-gap { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.hidden { display: none !important; }

.toast {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #263238;
  color: #fff;
  padding: 10px 14px;
  border-radius: 8px;
  z-index: 100;
  display: none;
  max-width: 300px;
  font-size: .86rem;
}
.toast.show { display: block; }

footer.app-foot {
  margin-top: 20px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
  font-size: .75rem;
  color: var(--muted);
  text-align: center;
}

/* ——— Cover / hub landing ——— */
.cover-hero {
  position: relative;
  overflow: hidden;
  border-radius: 16px;
  padding: 28px 22px 24px;
  margin-bottom: 14px;
  color: #fff;
  background: linear-gradient(135deg, #0d3d4f 0%, #1565c0 42%, #2e7d32 100%);
  box-shadow: 0 8px 28px rgba(21, 101, 192, .25);
}
.cover-hero::after {
  content: "";
  position: absolute;
  right: -40px; top: -40px;
  width: 180px; height: 180px;
  border-radius: 50%;
  background: rgba(255,255,255,.12);
}
.cover-hero h1 { margin: 0 0 8px; font-size: 1.55rem; position: relative; z-index: 1; }
.cover-hero .sub { margin: 0; opacity: .95; font-size: .92rem; position: relative; z-index: 1; max-width: 36em; }
.cover-hero .pills { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 6px; position: relative; z-index: 1; }
.cover-hero .pill {
  background: rgba(255,255,255,.18);
  border: 1px solid rgba(255,255,255,.35);
  border-radius: 999px;
  padding: 4px 10px;
  font-size: .75rem;
  font-weight: 600;
}
.hub-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 640px) { .hub-grid { grid-template-columns: 1fr; } }
a.hub-card {
  display: block; text-decoration: none; color: inherit;
  border-radius: 14px; padding: 20px 16px;
  border: 1px solid var(--border); border-left-width: 6px;
  background: #fff; box-shadow: var(--shadow);
  transition: transform .15s, box-shadow .15s;
}
a.hub-card:hover { transform: translateY(-3px); box-shadow: 0 8px 22px rgba(26,35,50,.12); }
a.hub-card.teacher { border-left-color: var(--blue); background: linear-gradient(135deg, var(--blue-bg), #fff 60%); }
a.hub-card.student { border-left-color: var(--green); background: linear-gradient(135deg, var(--green-bg), #fff 60%); }
a.hub-card h2 { margin: 0 0 6px; font-size: 1.2rem; }
a.hub-card.teacher h2 { color: var(--blue); }
a.hub-card.student h2 { color: var(--green); }
a.hub-card p { margin: 0; color: var(--muted); font-size: .88rem; }
a.hub-card .go { display: inline-block; margin-top: 12px; font-weight: 700; font-size: .85rem; }
a.hub-card.teacher .go { color: var(--blue); }
a.hub-card.student .go { color: var(--green); }
.sync-note {
  background: var(--amber-bg);
  border: 1px solid var(--amber-border);
  border-left: 4px solid var(--amber);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: .84rem;
  color: #5c4a1a;
  margin-bottom: 12px;
}
.mode-pill { font-size: .75rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-left: 6px; vertical-align: middle; }
.mode-pill.teacher { background: var(--blue-bg); color: var(--blue); }
.mode-pill.student { background: var(--green-bg); color: var(--green); }
body[data-mode="student"] header.app-header { border-left: 5px solid var(--green); }
body[data-mode="teacher"] header.app-header { border-left: 5px solid var(--blue); }
.tag.sa { background: #e8f5e9; color: #2e7d32; }
.tag.la { background: #e0f7fa; color: #00838f; }
.tag.essay { background: #fce4ec; color: #ad1457; }
.ta-short { min-height: 52px; }
.ta-long { min-height: 110px; }
.ta-essay { min-height: 180px; }
.publish-banner {
  background: var(--green-bg);
  border: 1px solid var(--green-border);
  border-left: 4px solid var(--green);
  border-radius: 8px;
  padding: 10px 12px;
  margin-bottom: 12px;
  font-size: .88rem;
}


/* PDF / question figure thumbs */
.q-figs, .bq-figs, .ip-figs {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 8px 0;
  align-items: flex-start;
}
.q-fig, .bq-fig, .ip-fig {
  max-width: 100%;
  max-height: 220px;
  width: auto;
  height: auto;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: #fff;
  object-fit: contain;
}
.ip-fig { max-height: 96px; max-width: 140px; }
.bq-fig { max-height: 160px; max-width: 240px; }
.bq-fig-wrap {
  display: inline-flex;
  flex-direction: column;
  gap: 4px;
  align-items: flex-start;
}
.bq-fig-wrap .btn { align-self: stretch; }
.bq-fig-note { font-size: .75rem; color: var(--muted); margin: 0 0 4px; }

</style>
</head>
<body data-mode="student">
<div class="wrap">

  <header class="app-header">
    <h1>QDCS-lite 學生作答版<span class="mode-pill student">學生</span></h1>
    <p class="sub">自動載入老師「目前發佈」測驗 · 無需分享碼 · <a href="index.html">封面</a></p>
  </header>
  
  <div class="legend" aria-label="顏色圖例">
    <span><i class="green"></i>作答（綠）</span>

    <span><i class="purple"></i>模擬器（紫）</span>

      </div>
      <div class="card tone-purple">
        <h2><span class="dot purple"></span>模擬器</h2>
        <a class="btn btn-sm btn-purple" href="../hydrostatic-osmotic-pressure.html" target="_blank" rel="noopener">流體／滲透壓</a>
      </div>
    </div>
  </section>
  <section id="panel-home" class="panel hidden"></section>
  <section id="panel-teacher" class="panel hidden">
    <div id="builder-wrap" class="hidden"></div><div id="teacher-list"></div>
    <input id="bq-title"/><input id="bq-subject"/><textarea id="bq-desc"></textarea><span id="bq-code"></span>
    <div id="builder-questions"></div><div id="share-area"></div>
    <button id="btn-new-quiz"></button><button id="btn-add-q"></button><button id="btn-save-quiz"></button>
    <button id="btn-cancel-builder"></button><select id="new-q-type"></select>
    <button id="btn-export-json"></button><input type="file" id="import-json-file"/>
  </section>
  <section id="panel-import" class="panel hidden">
    <input type="file" id="import-file"/><textarea id="import-text"></textarea>
    <button id="btn-parse-import"></button><button id="btn-import-apply"></button><div id="import-preview"></div>
  </section>
  <section id="panel-analytics" class="panel hidden">
    <select id="analytics-code"></select><button id="btn-refresh-analytics"></button>
    <button id="btn-export-csv-analytics"></button><button id="btn-export-attempts-json"></button>
    <input type="file" id="import-attempts-file"/><div id="analytics-out"></div>
  </section>
  <section id="panel-drive" class="panel hidden">
    <button id="btn-load-sample"></button><select id="drive-export-code"></select>
    <button id="btn-drive-json"></button><button id="btn-drive-csv"></button>
    <button id="btn-drive-readme"></button><div id="drive-filename-hint"></div>
  </section>
  <div id="publish-status" class="hidden"></div>
  <input type="text" id="join-code" class="hidden"/><button type="button" id="btn-join" class="hidden"></button>
  <footer class="app-foot">學生版 · 發佈測驗自動載入 · <a href="index.html">封面</a></footer>
  <script>
  document.addEventListener("DOMContentLoaded", function () {
    var btn = document.getElementById("btn-enter-stu");
    if (btn) btn.addEventListener("click", function () {
      var c = (document.getElementById("join-code-stu").value || "").trim().toUpperCase();
      document.getElementById("join-code").value = c;
      document.getElementById("btn-join").click();
    });
  });
  </script>

</div>
<div id="toast" class="toast" role="status"></div>
<script>window.QDCS_PAGE_MODE = "student";</script>
<script>
/**
 * Built-in sample quiz: hydrostatic / fluid pressure & osmotic pressure
 * Themes: capillary arteriole–venule exchange; potato × sucrose osmosis
 */
window.QDCS_SAMPLE_QUIZ = {
  id: "sample-fluid-osmotic",
  code: "BIODEMO",
  title: "流體壓力與滲透壓（示範卷）Fluid & Osmotic Pressure Sample",
  subject: "生物 Biology",
  description: "配合微血管組織液交換與馬鈴薯×蔗糖滲透模擬器之課堂小測。Auto-mark objective items; short answers use keywords.",
  createdAt: "2026-10-21T00:00:00+08:00",
  questions: [
    {
      id: "q1",
      type: "mcq",
      stem: "在微血管動脈端（arteriole end），下列哪一項通常較大，因而以過濾（filtration）為主？",
      options: [
        "靜水壓 hydrostatic pressure",
        "膠體滲透壓 oncotic / osmotic pressure",
        "大氣壓 atmospheric pressure",
        "細胞內壓 turgor pressure"
      ],
      answer: 0,
      marks: 1,
      explanation: "動脈端靜水壓通常高於膠體滲透壓，液體由微血管濾出至組織間隙。"
    },
    {
      id: "q2",
      type: "mcq",
      stem: "在微血管靜脈端（venule end），相對較強的力量是：",
      options: [
        "靜水壓遠高於滲透壓 → 持續過濾",

<script>
/**
 * QDCS-lite — educational quiz MVP for HK secondary science
 * Data: localStorage only. No paid APIs.
 */
(function () {
  "use strict";

  const LS_QUIZZES = "qdcs_lite_quizzes_v1";
  const LS_ATTEMPTS = "qdcs_lite_attempts_v1";
  const LS_PUBLISHED = "qdcs_lite_published_v1";

  const TYPE_LABEL = {
    mcq: "多項選擇 MCQ",
    tf: "是非 T/F",
    fill: "填充 Fill-in",
    sa: "短答 Short",
    la: "長答 Long",
    essay: "論述 Essay"
  };

  // ——— storage ———
  function loadQuizzes() {
    try {
      const raw = localStorage.getItem(LS_QUIZZES);
      return raw ? JSON.parse(raw) : {};
    } catch (e) {
      return {};
    }
  }
  function saveQuizzes(map) {
    localStorage.setItem(LS_QUIZZES, JSON.stringify(map));
  }
  function loadAttempts() {
    try {
      const raw = localStorage.getItem(LS_ATTEMPTS);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }
  function saveAttempts(arr) {
    localStorage.setItem(LS_ATTEMPTS, JSON.stringify(arr));
  }

  function ensureSample() {
    const map = loadQuizzes();
    if (!map.BIODEMO && window.QDCS_SAMPLE_QUIZ) {
      const s = JSON.parse(JSON.stringify(window.QDCS_SAMPLE_QUIZ));
      map[s.code] = s;
      saveQuizzes(map);
    }
  }

  function genCode() {
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let c = "";
    for (let i = 0; i < 6; i++) c += chars[Math.floor(Math.random() * chars.length)];
    const map = loadQuizzes();
    return map[c] ? genCode() : c;
  }

  function uid(prefix) {
    return (prefix || "id") + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.classList.remove("show"), 2800);
  }

  function showPanel(name) {
    // Teacher edition must never activate an in-page student answering panel
    if (pageMode() === "teacher" && name === "student") return;
    document.querySelectorAll(".panel").forEach((p) => p.classList.remove("active"));
    document.querySelectorAll(".nav-btn").forEach((b) => b.classList.remove("active"));
    const panel = document.getElementById("panel-" + name);
    if (panel) panel.classList.add("active");
    const btn = document.querySelector('.nav-btn[data-panel="' + name + '"]');
    if (btn) btn.classList.add("active");
    if (name === "home") renderHome();
    if (name === "teacher") renderTeacherList();
    if (name === "analytics") renderAnalyticsSelect();
    if (name === "drive") refreshDriveExportSelect();
  }

  // ——— URL share ———
  function getShareFromUrl() {
    const hash = location.hash.replace(/^#/, "");
    const params = new URLSearchParams(hash.includes("=") ? hash : "");
    // support #q=CODE or #CODE or ?q=CODE
    let code = params.get("q") || params.get("code");
    if (!code && hash && !hash.includes("=")) code = hash.toUpperCase();
    const qs = new URLSearchParams(location.search);
    if (!code) code = qs.get("q") || qs.get("code");
    return code ? code.toUpperCase() : null;
  }

  function studentLink(code) {
    // Prefer dedicated student page when present (same folder / same origin → shared localStorage)
    const here = location.href.split("#")[0].split("?")[0];
    let studentBase = here;
    if (/teacher\.html$/i.test(here) || /index\.html$/i.test(here) || /qdcs-lite-single\.html$/i.test(here) || /qdcs-lite-all-in-one\.html$/i.test(here)) {
      studentBase = here.replace(/[^/]+$/, "student.html");
    } else if (/teacher\.html$/i.test(location.pathname)) {
      studentBase = here.replace(/teacher\.html$/i, "student.html");
    }
    // If already on student.html, keep it
    if (/student\.html$/i.test(here)) studentBase = here;
    return studentBase + "#q=" + encodeURIComponent(code);
  }

  function teacherLink() {
    const here = location.href.split("#")[0].split("?")[0];
    if (/student\.html$/i.test(here)) return here.replace(/student\.html$/i, "teacher.html");
    if (/[^/]+$/.test(here)) return here.replace(/[^/]+$/, "teacher.html");
    return here;
  }

  function pageMode() {
    if (window.QDCS_PAGE_MODE) return window.QDCS_PAGE_MODE;
    const q = new URLSearchParams(location.search).get("mode");
    if (q === "teacher" || q === "student") return q;
    const path = (location.pathname || "").toLowerCase();
    if (path.endsWith("teacher.html")) return "teacher";
    if (path.endsWith("student.html")) return "student";
    // hash quiz code → student experience
    if (getShareFromUrl()) return "student";
    return "hub";
  }

  // ——— marking ———
  function norm(s) {
    return String(s || "")
      .trim()
      .toLowerCase()
      .replace(/\s+/g, " ");
  }

  function markQuestion(q, studentAns) {
    const marks = Number(q.marks) || 1;
    if (q.type === "mcq") {
      const ok = Number(studentAns) === Number(q.answer);
      return { score: ok ? marks : 0, max: marks, correct: ok };
    }
    if (q.type === "tf") {
      const sa = studentAns === true || studentAns === "true" || studentAns === "T" || studentAns === "是";
      const ok = sa === Boolean(q.answer);
      return { score: ok ? marks : 0, max: marks, correct: ok };
    }
    if (q.type === "fill") {
      const answers = Array.isArray(q.answer) ? q.answer : [q.answer];
      const n = norm(studentAns);
      const ok = answers.some((a) => norm(a) === n || (n && norm(a).includes(n) && n.length >= 2));
      // exact first; also accept if student matches one answer exactly after norm
      const exact = answers.some((a) => norm(a) === n);
      return { score: exact || ok ? marks : 0, max: marks, correct: exact || ok };
    }
    // 短答：exact 或關鍵詞（較嚴）
    if (q.type === "sa") {
      const text = norm(studentAns);
      const exacts = Array.isArray(q.answer) ? q.answer : q.answer ? [q.answer] : [];
      const kws = q.answerKeywords || [];
      if (!text) return { score: 0, max: marks, correct: false, matched: [] };
      if (exacts.some((a) => norm(a) === text)) {
        return { score: marks, max: marks, correct: true, matched: ["exact"] };
      }
      const matched = kws.filter((k) => text.includes(norm(k)));
      let ratio = 0;
      if (matched.length >= 2 || (kws.length && matched.length >= Math.ceil(kws.length / 2))) ratio = 1;
      else if (matched.length >= 1) ratio = 0.5;
      const score = Math.round(marks * ratio * 10) / 10;
      return { score, max: marks, correct: ratio === 1, partial: ratio === 0.5, matched };
    }
    // 長答：關鍵詞部分給分（較寬）
    if (q.type === "la") {
      const text = norm(studentAns);
      const kws = q.answerKeywords || [];
      if (!text) return { score: 0, max: marks, correct: false, matched: [], needsManual: false };
      if (!kws.length) {
        return { score: 0, max: marks, correct: false, partial: true, matched: [], needsManual: true, note: "待教師評閱" };
      }
      const matched = kws.filter((k) => text.includes(norm(k)));
      const ratio = kws.length ? matched.length / kws.length : 0;
      let award = 0;
      if (ratio >= 0.6) award = 1;
      else if (ratio >= 0.3 || matched.length >= 1) award = 0.5;
      const score = Math.round(marks * award * 10) / 10;
      return { score, max: marks, correct: award === 1, partial: award === 0.5, matched, needsManual: award < 1 };
    }
    // 論述：預設不自動給滿分；有關鍵詞則最多半分作參考，其餘待人工
    if (q.type === "essay") {
      const text = norm(studentAns);
      const kws = q.answerKeywords || [];
      if (!text) return { score: 0, max: marks, correct: false, matched: [], needsManual: true, note: "待教師評閱" };
      const matched = kws.filter((k) => text.includes(norm(k)));
      let score = 0;
      if (kws.length && matched.length >= Math.max(1, Math.ceil(kws.length / 3))) {
        score = Math.round(marks * 0.5 * 10) / 10;
      }
      return {
        score,
        max: marks,
        correct: false,
        partial: score > 0,
        matched,
        needsManual: true,
        note: "論述題須教師評閱（系統僅給參考分）"
      };
    }
    return { score: 0, max: marks, correct: false };
  }

  // ——— PDF figure extraction & association (MVP) ———
  var QDCS_PDF_IMG_MAX_PER_PAGE = 3;
  var QDCS_PDF_IMG_MAX_TOTAL = 12;
  var QDCS_PDF_IMG_MIN_PX = 48;
  var QDCS_PDF_IMG_MAX_SIDE = 900;
  var QDCS_PDF_IMG_JPEG_Q = 0.72;
  var QDCS_LS_WARN_BYTES = 1.5 * 1024 * 1024;

  function isSafeImageDataUrl(url) {
    return typeof url === "string" && /^data:image\/(png|jpe?g|webp);base64,/i.test(url);
  }

  function sanitizeQuestionImages(arr) {
    if (!Array.isArray(arr)) return [];
    return arr.filter(isSafeImageDataUrl).slice(0, QDCS_PDF_IMG_MAX_TOTAL);
  }

  function ensureQuestionImages(q) {
    if (!q) return q;
    q.images = sanitizeQuestionImages(q.images);
    return q;
  }

  function renderSafeFigsHtml(images, imgClass, alt) {
    const list = sanitizeQuestionImages(images);
    if (!list.length) return "";
    const cls = imgClass || "q-fig";
    const a = alt || "題目附圖";
    return (
      '<div class="q-figs">' +
      list
        .map(function (src) {
          return '<img class="' + cls + '" alt="' + a + '" src="' + src + '" />';
        })
        .join("") +
      "</div>"
    );
  }

  function pdfRawToRGBA(img) {
    const w = img.width | 0;
    const h = img.height | 0;
    if (!w || !h || !img.data) return null;
    const data = img.data;
    const out = new Uint8ClampedArray(w * h * 4);
    const kind = img.kind;
    // pdf.js ImageKind: GRAYSCALE_1BPP=1, RGB_24BPP=2, RGBA_32BPP=3
    if (kind === 3 || data.length === w * h * 4) {
      out.set(data.subarray ? data.subarray(0, out.length) : data);
      return out;
    }
    if (kind === 2 || data.length === w * h * 3) {
      for (let i = 0, j = 0; j < out.length && i + 2 < data.length; i += 3, j += 4) {
        out[j] = data[i];
        out[j + 1] = data[i + 1];
        out[j + 2] = data[i + 2];
        out[j + 3] = 255;
      }
      return out;
    }
    if (kind === 1 || data.length === Math.ceil(w / 8) * h) {
      let bit = 0;
      let byteIdx = 0;
      for (let y = 0; y < h; y++) {
        bit = 0;
        for (let x = 0; x < w; x++) {
          const byte = data[byteIdx] || 0;
          const on = (byte >> (7 - bit)) & 1;
          const v = on ? 0 : 255;
          const j = (y * w + x) * 4;
          out[j] = out[j + 1] = out[j + 2] = v;
          out[j + 3] = 255;
          bit++;
          if (bit === 8) {
            bit = 0;
            byteIdx++;
          }
        }
        if (bit !== 0) byteIdx++;
      }
      return out;
    }
    if (data.length >= w * h && data.length < w * h * 3) {
      for (let i = 0; i < w * h; i++) {
        const v = data[i];
        const j = i * 4;
        out[j] = out[j + 1] = out[j + 2] = v;
        out[j + 3] = 255;
      }
      return out;
    }
    return null;
  }

  function pdfImageToDataUrl(img) {
    if (!img) return null;
    try {
      const w = (img.width || img.naturalWidth || 0) | 0;
      const h = (img.height || img.naturalHeight || 0) | 0;
      if (!w || !h) return null;
      if (w < QDCS_PDF_IMG_MIN_PX || h < QDCS_PDF_IMG_MIN_PX) return null;

      let dw = w;
      let dh = h;
      const longest = Math.max(w, h);
      if (longest > QDCS_PDF_IMG_MAX_SIDE) {
        const s = QDCS_PDF_IMG_MAX_SIDE / longest;
        dw = Math.max(1, Math.round(w * s));
        dh = Math.max(1, Math.round(h * s));
      }

      const canvas = document.createElement("canvas");
      canvas.width = dw;
      canvas.height = dh;
      const ctx = canvas.getContext("2d");
      if (!ctx) return null;

      if (typeof HTMLImageElement !== "undefined" && img instanceof HTMLImageElement) {
        ctx.drawImage(img, 0, 0, dw, dh);
      } else if (typeof ImageBitmap !== "undefined" && img instanceof ImageBitmap) {
        ctx.drawImage(img, 0, 0, dw, dh);
      } else if (img.bitmap) {
        ctx.drawImage(img.bitmap, 0, 0, dw, dh);
      } else if (img.data) {
        const rgba = pdfRawToRGBA(img);
        if (!rgba) return null;
        const src = document.createElement("canvas");
        src.width = w;
        src.height = h;
        const sctx = src.getContext("2d");
        sctx.putImageData(new ImageData(rgba, w, h), 0, 0);
        ctx.drawImage(src, 0, 0, dw, dh);
      } else {
        return null;
      }
      return canvas.toDataURL("image/jpeg", QDCS_PDF_IMG_JPEG_Q);
    } catch (e) {
      return null;
    }
  }

  function resolvePdfImgObj(page, name) {
    return new Promise(function (resolve) {
      var done = false;
      function finish(obj) {
        if (done) return;
        done = true;
        resolve(obj || null);
      }
      try {
        var sync = page.objs.get(name);
        if (sync) return finish(sync);
      } catch (e1) {}
      try {
        if (page.commonObjs) {
          var sync2 = page.commonObjs.get(name);
          if (sync2) return finish(sync2);
        }
      } catch (e2) {}
      try {
        page.objs.get(name, finish);
      } catch (e3) {
        try {
          if (page.commonObjs) page.commonObjs.get(name, finish);
          else finish(null);
        } catch (e4) {
          finish(null);
        }
      }
      setTimeout(function () {
        finish(null);
      }, 800);
    });
  }

  function pageLooksFigureHeavy(text, imageCount) {
    if (imageCount > 0) return false;
    const t = (text || "").replace(/\s+/g, "");
    return t.length < 80;
  }

  async function extractPdfPageImages(page, pdfjs) {
    const out = [];
    const seen = {};
    try {
      const OPS = pdfjs.OPS || {};
      const paintOps = {};
      [
        "paintImageXObject",
        "paintJpegXObject",
        "paintImageMaskXObject",
        "paintInlineImageXObject",
        "paintImageXObjectRepeat",
        "paintImageMaskXObjectRepeat",
        "paintImageMaskXObjectGroup"
      ].forEach(function (k) {
        if (OPS[k] != null) paintOps[OPS[k]] = k;
      });
      const opList = await page.getOperatorList();
      const fnArray = opList.fnArray || [];
      const argsArray = opList.argsArray || [];
      for (let i = 0; i < fnArray.length; i++) {
        if (out.length >= QDCS_PDF_IMG_MAX_PER_PAGE) break;
        const fn = fnArray[i];
        if (!paintOps[fn]) continue;
        const args = argsArray[i] || [];
        const name = args[0];
        if (!name || typeof name !== "string") continue;
        if (seen[name]) continue;
        seen[name] = true;
        const imgObj = await resolvePdfImgObj(page, name);
        const dataUrl = pdfImageToDataUrl(imgObj);
        if (dataUrl) out.push(dataUrl);
      }
    } catch (e) {
      /* ignore extraction errors per page */
    }
    return out;
  }

  /**
   * Associate page images to parsed questions.
   * pages: [{ page, text, images: string[] }]
   * Mutates questions' .images arrays; returns questions.
   */
  function associatePdfImagesToQuestions(questions, pages) {
    if (!Array.isArray(questions) || !questions.length) return questions || [];
    questions.forEach(function (q) {
      if (!Array.isArray(q.images)) q.images = [];
    });
    if (!Array.isArray(pages) || !pages.length) return questions;

    const assigned = {};
    const leftovers = [];

    function stemKey(stem) {
      return String(stem || "")
        .replace(/\s+/g, " ")
        .trim();
    }

    function overlaps(stem, pageText) {
      const s = stemKey(stem);
      const p = String(pageText || "").replace(/\s+/g, " ");
      if (!s || !p) return false;
      // Full / head stem present on page (CJK stems are often < 20 chars)
      const head = s.slice(0, 30);
      if (head.length >= 6 && p.indexOf(head) !== -1) return true;
      if (s.length >= 12) {
        const minLen = Math.min(20, s.length);
        for (let len = minLen; len <= Math.min(40, s.length); len++) {
          if (p.indexOf(s.slice(0, len)) !== -1) return true;
        }
        // also try a mid-stem window ≥ 12 chars
        for (let i = 0; i + 12 <= s.length; i++) {
          if (p.indexOf(s.slice(i, i + 12)) !== -1) return true;
        }
      }
      return false;
    }

    pages.forEach(function (pg) {
      const imgs = sanitizeQuestionImages(pg.images || []);
      if (!imgs.length) return;
      const matches = [];
      questions.forEach(function (q, qi) {
        if (overlaps(q.stem, pg.text)) matches.push(qi);
      });
      if (!matches.length) {
        leftovers.push({ page: pg.page, images: imgs });
        return;
      }
      if (matches.length === 1) {
        const qi = matches[0];
        questions[qi].images = sanitizeQuestionImages((questions[qi].images || []).concat(imgs));
        if (!questions[qi].imageNotes) questions[qi].imageNotes = "來自 PDF 匯入";
        assigned[qi] = true;
      } else {
        imgs.forEach(function (img, ii) {
          const qi = matches[ii % matches.length];
          questions[qi].images = sanitizeQuestionImages((questions[qi].images || []).concat([img]));
          if (!questions[qi].imageNotes) questions[qi].imageNotes = "來自 PDF 匯入";
          assigned[qi] = true;
        });
      }
    });

    // Fallback: leftover page images → nearest question by order (page ≈ question index)
    leftovers.forEach(function (lo) {
      const approx = Math.min(questions.length - 1, Math.max(0, (lo.page || 1) - 1));
      let target = approx;
      // prefer unassigned nearby
      if (assigned[target]) {
        for (let d = 1; d < questions.length; d++) {
          if (approx - d >= 0 && !assigned[approx - d]) {
            target = approx - d;
            break;
          }
          if (approx + d < questions.length && !assigned[approx + d]) {
            target = approx + d;
            break;
          }
        }
      }
      questions[target].images = sanitizeQuestionImages((questions[target].images || []).concat(lo.images || []));
      if (!questions[target].imageNotes) questions[target].imageNotes = "來自 PDF 匯入";
      assigned[target] = true;
    });

    questions.forEach(ensureQuestionImages);
    return questions;
  }

  function estimateQuizStorageBytes(quiz) {
    try {
      return JSON.stringify(quiz || {}).length;
    } catch (e) {
      return 0;
    }
  }

  function warnIfQuizLarge(quiz) {
    const n = estimateQuizStorageBytes(quiz);
    if (n >= QDCS_LS_WARN_BYTES) {
      toast("警告：測驗資料約 " + Math.round(n / 1024) + " KB，localStorage 可能偏大（仍已儲存）");
    }
  }


  // ——— import heuristics ———
  function parseImportText(text) {
    const lines = text.replace(/\r\n/g, "\n").split("\n");
    const chunks = [];
    let cur = [];
    const startRe = /^(?:Q\s*\d+|第\s*\d+\s*題|\d+[\.\)、]|[（(]\d+[）)]|\d+\s*[\.\)])\s*/i;

    function flush() {
      const body = cur.join("\n").trim();
      if (body) chunks.push(body);
      cur = [];
    }

    for (const line of lines) {
      if (startRe.test(line.trim()) && cur.length) flush();
      if (line.trim() || cur.length) cur.push(line);
    }
    flush();

    const questions = [];
    for (const chunk of chunks) {
      const q = heuristicQuestion(chunk);
      if (q) questions.push(q);
    }
    return questions;
  }

  function heuristicQuestion(chunk) {
    const lines = chunk.split("\n").map((l) => l.trim()).filter(Boolean);
    if (!lines.length) return null;
    let stemLine = lines[0].replace(/^(?:Q\s*\d+|第\s*\d+\s*題|\d+[\.\)、]|[（(]\d+[）)]|\d+\s*[\.\)])\s*/i, "");
    const rest = lines.slice(1);
    const optRe = /^(?:[A-Da-d][\.\)\、\s]|[（(][A-Da-d][）)])\s*(.*)$/;
    const options = [];
    const nonOpt = [];
    for (const r of rest) {
      const m = r.match(optRe);
      if (m) options.push(m[1] || m[0].replace(optRe, "$1"));
      else nonOpt.push(r);
    }

    // answer line
    let answerHint = "";
    const ansLine = nonOpt.find((l) => /^(答案|Answer|Ans)\s*[:：]/i.test(l));
    if (ansLine) answerHint = ansLine.replace(/^(答案|Answer|Ans)\s*[:：]\s*/i, "").trim();

    if (options.length >= 2) {
      let ansIdx = 0;
      if (answerHint) {
        const letter = answerHint.trim().toUpperCase().charAt(0);
        if (letter >= "A" && letter <= "D") ansIdx = letter.charCodeAt(0) - 65;
      }
      return {
        id: uid("q"),
        type: "mcq",
        stem: stemLine + (nonOpt.filter((l) => l !== ansLine).length ? "\n" + nonOpt.filter((l) => l !== ansLine).join("\n") : ""),
        options: options.slice(0, 6),
        answer: Math.min(ansIdx, options.length - 1),
        marks: 1,
        explanation: "",
        images: []
      };
    }

    // T/F
    if (/[（(]?[Tt]rue\s*\/\s*[Ff]alse[）)]?|是非|對錯|T\s*\/\s*F/i.test(chunk) || /^(對|錯|是|非|True|False)\s*$/i.test(answerHint)) {
      let ans = true;
      if (/錯|非|False|F/i.test(answerHint)) ans = false;
      return { id: uid("q"), type: "tf", stem: stemLine, answer: ans, marks: 1, explanation: "", images: [] };
    }

    // fill: blanks ____ or （　）
    if (/_{2,}|（\s*）|\(\s*\)|【\s*】/.test(chunk)) {
      const fills = answerHint ? answerHint.split(/[/;,，、]/).map((s) => s.trim()).filter(Boolean) : [""];
      return { id: uid("q"), type: "fill", stem: stemLine + (rest.length ? "\n" + rest.join("\n") : ""), answer: fills.length ? fills : [""], marks: 1, explanation: "", images: [] };
    }

    const stemRest = stemLine + (nonOpt.filter((l) => l !== ansLine).length ? "\n" + nonOpt.filter((l) => l !== ansLine).join("\n") : "");
    const kws = answerHint ? answerHint.split(/[/;,，、]/).map((s) => s.trim()).filter(Boolean) : [];
    if (/論述|essay|討論|試論/i.test(chunk)) {
      return { id: uid("q"), type: "essay", stem: stemRest, answerKeywords: kws, marks: 6, explanation: "", images: [] };
    }
    if (/長答|long\s*answer|詳細說明|試解釋/i.test(chunk) || stemRest.length > 120) {
      return { id: uid("q"), type: "la", stem: stemRest, answerKeywords: kws, marks: 4, explanation: "", images: [] };
    }
    return { id: uid("q"), type: "sa", stem: stemRest, answerKeywords: kws, answer: kws.slice(0, 1), marks: 2, explanation: "", images: [] };
  }

  // ——— builder state ———
  let editQuiz = null;

  function blankQuiz() {
    return {
      id: uid("quiz"),
      code: genCode(),
      title: "",
      subject: "綜合科學 / 生物",
      description: "",
      createdAt: new Date().toISOString(),
      questions: []
    };
  }

  function blankQuestion(type) {
    type = type || "mcq";
    const base = { id: uid("q"), type, stem: "", marks: 1, explanation: "", images: [] };
    if (type === "mcq") {
      base.options = ["", "", "", ""];
      base.answer = 0;
    } else if (type === "tf") {
      base.answer = true;
    } else if (type === "fill") {
      base.answer = [""];
    } else if (type === "sa") {
      base.answer = [""];
      base.answerKeywords = [];
      base.marks = 2;
    } else if (type === "la") {
      base.answerKeywords = [];
      base.marks = 4;
    } else if (type === "essay") {
      base.answerKeywords = [];
      base.marks = 6;
      base.markingNote = "論述題：課堂後由教師評閱；關鍵詞僅作參考分";
    } else {
      base.answerKeywords = [];
      base.marks = 2;
    }
    return base;
  }

  function getPublished() {
    try {
      const raw = localStorage.getItem(LS_PUBLISHED);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }

  function publishQuiz(quiz) {
    if (!quiz || !quiz.code) return;
    const copy = JSON.parse(JSON.stringify(quiz));
    const payload = {
      publishedAt: new Date().toISOString(),
      code: copy.code,
      title: copy.title || copy.code,
      quiz: copy
    };
    localStorage.setItem(LS_PUBLISHED, JSON.stringify(payload));
    const map = loadQuizzes();
    map[copy.code] = copy;
    saveQuizzes(map);
    return payload;
  }

  function unpublishQuiz() {
    localStorage.removeItem(LS_PUBLISHED);
  }

  function renderHome() {
    const map = loadQuizzes();
    const list = document.getElementById("home-quiz-list");
    if (!list) return;
    const codes = Object.keys(map);
    if (!codes.length) {
      list.innerHTML = '<p class="muted">尚未有測驗。請到「教師建卷」建立，或載入示範卷 BIODEMO。</p>';
      return;
    }
    list.innerHTML = codes
      .map((c) => {
        const q = map[c];
        return `<div class="quiz-list-item">
          <div>
            <strong>${escapeHtml(q.title || c)}</strong>
            <span class="tag">${escapeHtml(c)}</span>
            <div class="muted">${(q.questions || []).length} 題 · ${escapeHtml(q.subject || "")}</div>
          </div>
          <div class="flex-gap">
            <button type="button" class="btn btn-sm btn-primary" data-take="${escapeHtml(c)}">開啟學生頁</button>
            <button type="button" class="btn btn-sm" data-anal="${escapeHtml(c)}">成績</button>
          </div>
        </div>`;
      })
      .join("");
    list.querySelectorAll("[data-take]").forEach((b) =>
      b.addEventListener("click", () => openStudent(b.getAttribute("data-take")))
    );
    list.querySelectorAll("[data-anal]").forEach((b) => {
      b.addEventListener("click", () => {
        showPanel("analytics");
        document.getElementById("analytics-code").value = b.getAttribute("data-anal");
        renderAnalytics();
      });
    });
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function renderTeacherList() {
    const map = loadQuizzes();
    const el = document.getElementById("teacher-list");
    const codes = Object.keys(map);
    el.innerHTML =
      codes
        .map((c) => {
          const q = map[c];
          return `<div class="quiz-list-item">
          <div><strong>${escapeHtml(q.title || c)}</strong> <code>${escapeHtml(c)}</code>
          <div class="muted">${(q.questions || []).length} 題</div></div>
          <div class="flex-gap">
            <button type="button" class="btn btn-sm" data-edit="${escapeHtml(c)}">編輯</button>
            <button type="button" class="btn btn-sm btn-success" data-pub="${escapeHtml(c)}">發佈</button>
            <button type="button" class="btn btn-sm" data-copy="${escapeHtml(c)}">複製學生頁</button>
            <button type="button" class="btn btn-sm btn-danger" data-del="${escapeHtml(c)}">刪除</button>
          </div></div>`;
        })
        .join("") || '<p class="muted">未有測驗。</p>';

    el.querySelectorAll("[data-edit]").forEach((b) =>
      b.addEventListener("click", () => startEdit(b.getAttribute("data-edit")))
    );
    el.querySelectorAll("[data-copy]").forEach((b) =>
      b.addEventListener("click", () => {
        const link = studentLink(b.getAttribute("data-copy")).replace(/#q=.*/, "");
        navigator.clipboard.writeText(link).then(
          () => toast("已複製學生頁（發佈後無需碼）"),
          () => toast(link)
        );
      })
    );
    el.querySelectorAll("[data-pub]").forEach((b) =>
      b.addEventListener("click", () => {
        const code = b.getAttribute("data-pub");
        const q = loadQuizzes()[code];
        if (!q) return;
        publishQuiz(q);
        toast("已發佈「" + (q.title || code) + "」為目前測驗");
        updatePublishBanner();
        renderTeacherList();
      })
    );
    el.querySelectorAll("[data-del]").forEach((b) =>
      b.addEventListener("click", () => {
        const code = b.getAttribute("data-del");
        if (!confirm("確定刪除測驗 " + code + "？成績紀錄仍會保留。")) return;
        const m = loadQuizzes();
        delete m[code];
        saveQuizzes(m);
        renderTeacherList();
        toast("已刪除");
      })
    );
  }

  function startEdit(code) {
    const map = loadQuizzes();
    editQuiz = code && map[code] ? JSON.parse(JSON.stringify(map[code])) : blankQuiz();
    document.getElementById("builder-wrap").classList.remove("hidden");
    document.getElementById("bq-title").value = editQuiz.title || "";
    document.getElementById("bq-subject").value = editQuiz.subject || "";
    document.getElementById("bq-desc").value = editQuiz.description || "";
    document.getElementById("bq-code").textContent = editQuiz.code;
    renderBuilderQuestions();
    document.getElementById("builder-wrap").scrollIntoView({ behavior: "smooth" });
  }

  function renderBuilderFigs(q, i) {
    const imgs = sanitizeQuestionImages(q && q.images);
    if (!imgs.length) return "";
    const note =
      '<p class="bq-fig-note">' +
      escapeHtml((q && q.imageNotes) || "來自 PDF 匯入") +
      "</p>";
    const thumbs = imgs
      .map(function (src, ii) {
        return (
          '<div class="bq-fig-wrap">' +
          '<img class="bq-fig" alt="題目附圖" src="' +
          src +
          '" />' +
          '<button type="button" class="btn btn-sm" data-rmimg="' +
          i +
          '" data-imgi="' +
          ii +
          '">移除圖</button></div>'
        );
      })
      .join("");
    return '<div class="bq-figs">' + note + thumbs + "</div>";
  }

  function renderBuilderQuestions() {
    const box = document.getElementById("builder-questions");
    if (!editQuiz.questions.length) {
      box.innerHTML = '<p class="muted">尚未加入題目。按「新增題目」或使用「簡化匯入」。</p>';
      return;
    }
    box.innerHTML = editQuiz.questions
      .map((q, i) => {
        const typeTag = `<span class="tag ${q.type}">${TYPE_LABEL[q.type] || q.type}</span>`;
        let body = "";
        if (q.type === "mcq") {
          body = (q.options || [])
            .map(
              (o, oi) => `<div class="opt-row">
              <input type="radio" name="ans_${i}" ${Number(q.answer) === oi ? "checked" : ""} data-qi="${i}" data-optans="${oi}" />
              <input type="text" value="${escapeHtml(o)}" data-qi="${i}" data-opt="${oi}" placeholder="選項 ${String.fromCharCode(65 + oi)}" />
            </div>`
            )
            .join("");
          body += `<button type="button" class="btn btn-sm" data-addopt="${i}">＋選項</button>`;
        } else if (q.type === "tf") {
          body = `<label><input type="radio" name="tf_${i}" data-qi="${i}" data-tf="true" ${q.answer ? "checked" : ""}/> 正確 True</label>
            <label style="margin-left:12px"><input type="radio" name="tf_${i}" data-qi="${i}" data-tf="false" ${!q.answer ? "checked" : ""}/> 錯誤 False</label>`;
        } else if (q.type === "fill") {
          const ans = Array.isArray(q.answer) ? q.answer.join(" / ") : q.answer || "";
          body = `<label class="field">可接受答案（以 / 分隔）<input type="text" data-qi="${i}" data-fillans value="${escapeHtml(ans)}" /></label>`;
        } else if (q.type === "sa") {
          const ans = Array.isArray(q.answer) ? q.answer.join(" / ") : q.answer || "";
          const kws = (q.answerKeywords || []).join(" / ");
          body = `<label class="field">短答可接受答案（exact，/ 分隔）<input type="text" data-qi="${i}" data-saans value="${escapeHtml(ans)}" /></label>
            <label class="field">關鍵詞（選填，/ 分隔）<input type="text" data-qi="${i}" data-sakw value="${escapeHtml(kws)}" /></label>
            <p class="muted">評分：先 exact，再關鍵詞（全對／半分）</p>`;
        } else if (q.type === "la") {
          const kws = (q.answerKeywords || []).join(" / ");
          body = `<label class="field">長答關鍵詞（/ 分隔，按比例給分）<input type="text" data-qi="${i}" data-sakw value="${escapeHtml(kws)}" /></label>
            <p class="muted">評分：命中約 60% 關鍵詞→滿分；部分→半分；無關鍵詞則標「待評閱」</p>`;
        } else if (q.type === "essay") {
          const kws = (q.answerKeywords || []).join(" / ");
          body = `<label class="field">論述參考關鍵詞（選填）<input type="text" data-qi="${i}" data-sakw value="${escapeHtml(kws)}" /></label>
            <p class="muted">論述題以教師評閱為主；系統最多給參考半分</p>`;
        } else {
          const kws = (q.answerKeywords || []).join(" / ");
          body = `<label class="field">關鍵詞<input type="text" data-qi="${i}" data-sakw value="${escapeHtml(kws)}" /></label>`;
        }
        return `<div class="q-block" data-qi="${i}">
          <div class="q-head">
            <span class="q-num">Q${i + 1}</span>${typeTag}
            <label>分數 <input type="number" min="0.5" step="0.5" style="width:64px" data-qi="${i}" data-marks value="${q.marks}" /></label>
            <button type="button" class="btn btn-sm btn-danger" data-rmq="${i}">刪題</button>
            <button type="button" class="btn btn-sm" data-upq="${i}" ${i === 0 ? "disabled" : ""}>↑</button>
            <button type="button" class="btn btn-sm" data-dnq="${i}" ${i === editQuiz.questions.length - 1 ? "disabled" : ""}>↓</button>
          </div>
          <label class="field">題幹
            <textarea data-qi="${i}" data-stem rows="2">${escapeHtml(q.stem)}</textarea>
          </label>
          ${renderBuilderFigs(q, i)}
          ${body}
          <label class="field">解析（選填）
            <input type="text" data-qi="${i}" data-expl value="${escapeHtml(q.explanation || "")}" />
          </label>
        </div>`;
      })
      .join("");

    box.querySelectorAll("[data-stem]").forEach((el) =>
      el.addEventListener("input", () => {
        editQuiz.questions[+el.dataset.qi].stem = el.value;
      })
    );
    box.querySelectorAll("[data-marks]").forEach((el) =>
      el.addEventListener("change", () => {
        editQuiz.questions[+el.dataset.qi].marks = Number(el.value) || 1;
      })
    );
    box.querySelectorAll("[data-expl]").forEach((el) =>
      el.addEventListener("input", () => {
        editQuiz.questions[+el.dataset.qi].explanation = el.value;
      })
    );
    box.querySelectorAll("[data-opt]").forEach((el) =>
      el.addEventListener("input", () => {
        editQuiz.questions[+el.dataset.qi].options[+el.dataset.opt] = el.value;
      })
    );
    box.querySelectorAll("[data-optans]").forEach((el) =>
      el.addEventListener("change", () => {
        if (el.checked) editQuiz.questions[+el.dataset.qi].answer = +el.dataset.optans;
      })
    );
    box.querySelectorAll("[data-tf]").forEach((el) =>
      el.addEventListener("change", () => {
        if (el.checked) editQuiz.questions[+el.dataset.qi].answer = el.dataset.tf === "true";
      })
    );
    box.querySelectorAll("[data-fillans]").forEach((el) =>
      el.addEventListener("input", () => {
        editQuiz.questions[+el.dataset.qi].answer = el.value.split("/").map((s) => s.trim()).filter(Boolean);
      })
    );
    box.querySelectorAll("[data-sakw]").forEach((el) =>
      el.addEventListener("input", () => {
        editQuiz.questions[+el.dataset.qi].answerKeywords = el.value.split("/").map((s) => s.trim()).filter(Boolean);
      })
    );
    box.querySelectorAll("[data-saans]").forEach((el) =>
      el.addEventListener("input", () => {
        editQuiz.questions[+el.dataset.qi].answer = el.value.split("/").map((s) => s.trim()).filter(Boolean);
      })
    );
    box.querySelectorAll("[data-rmq]").forEach((el) =>
      el.addEventListener("click", () => {
        editQuiz.questions.splice(+el.dataset.rmq, 1);
        renderBuilderQuestions();
      })
    );
    box.querySelectorAll("[data-upq]").forEach((el) =>
      el.addEventListener("click", () => {
        const i = +el.dataset.upq;
        if (i <= 0) return;
        const t = editQuiz.questions[i - 1];
        editQuiz.questions[i - 1] = editQuiz.questions[i];
        editQuiz.questions[i] = t;
        renderBuilderQuestions();
      })
    );
    box.querySelectorAll("[data-dnq]").forEach((el) =>
      el.addEventListener("click", () => {
        const i = +el.dataset.dnq;
        if (i >= editQuiz.questions.length - 1) return;
        const t = editQuiz.questions[i + 1];
        editQuiz.questions[i + 1] = editQuiz.questions[i];
        editQuiz.questions[i] = t;
        renderBuilderQuestions();
      })
    );
    box.querySelectorAll("[data-addopt]").forEach((el) =>
      el.addEventListener("click", () => {
        const q = editQuiz.questions[+el.dataset.addopt];
        q.options = q.options || [];
        q.options.push("");
        renderBuilderQuestions();
      })
    );
    box.querySelectorAll("[data-rmimg]").forEach((el) =>
      el.addEventListener("click", () => {
        const qi = +el.dataset.rmimg;
        const ii = +el.dataset.imgi;
        const q = editQuiz.questions[qi];
        if (!q || !Array.isArray(q.images)) return;
        q.images.splice(ii, 1);
        if (!q.images.length) delete q.imageNotes;
        renderBuilderQuestions();
      })
    );
  }

  function saveCurrentQuiz() {
    if (!editQuiz) return;
    editQuiz.title = document.getElementById("bq-title").value.trim() || "未命名測驗";
    editQuiz.subject = document.getElementById("bq-subject").value.trim();
    editQuiz.description = document.getElementById("bq-desc").value.trim();
    editQuiz.updatedAt = new Date().toISOString();
    const map = loadQuizzes();
    map[editQuiz.code] = editQuiz;
    saveQuizzes(map);
    const link = studentLink(editQuiz.code);
    const plainStudent = studentLink(editQuiz.code).replace(/#q=.*/, "").replace(/\?.*$/, "");
    const pub = getPublished();
    const isPub = pub && pub.code === editQuiz.code;
    document.getElementById("share-area").innerHTML = `
      <div class="share-box">
        <div><strong>已儲存</strong> · 碼 <code>${escapeHtml(editQuiz.code)}</code>
          ${isPub ? ' · <span class="tag" style="background:#e8f5e9;color:#2e7d32">目前發佈中</span>' : ""}
        </div>
        <p class="muted" style="margin:8px 0">建議：按「發佈為目前測驗」後，學生直接開 <code>student.html</code>（<strong>無需輸入分享碼</strong>，同源同瀏覽器）。</p>
        <div class="flex-gap" style="margin-top:8px">
          <button type="button" class="btn btn-sm btn-success" id="btn-publish-quiz">發佈為目前測驗</button>
          <button type="button" class="btn btn-sm" id="btn-unpublish-quiz">取消發佈</button>
          <button type="button" class="btn btn-sm btn-primary" id="btn-copy-link">複製學生頁連結</button>
          <button type="button" class="btn btn-sm" id="btn-preview-stu">預覽學生頁</button>
        </div>
        <div style="margin-top:8px" class="muted">備用（有碼）：<code id="share-link">${escapeHtml(link)}</code></div>
      </div>`;
    document.getElementById("btn-copy-link").onclick = () => {
      const url = plainStudent || link;
      navigator.clipboard.writeText(url).then(() => toast("已複製學生頁連結"), () => toast(url));
    };
    document.getElementById("btn-preview-stu").onclick = () => {
      // Always open dedicated student.html (teacher page never embeds answering UI)
      openStudent(editQuiz.code);
    };
    document.getElementById("btn-publish-quiz").onclick = () => {
      publishQuiz(editQuiz);
      toast("已發佈「目前測驗」— 學生開 student.html 即載入");
      saveCurrentQuiz();
    };
    document.getElementById("btn-unpublish-quiz").onclick = () => {
      unpublishQuiz();
      toast("已取消發佈");
      saveCurrentQuiz();
    };
    toast("已儲存測驗 " + editQuiz.code);
    renderTeacherList();
    updatePublishBanner();
  }

  function updatePublishBanner() {
    const el = document.getElementById("publish-status");
    if (!el) return;
    const pub = getPublished();
    if (!pub || !pub.quiz) {
      el.innerHTML = '<span class="muted">尚未發佈目前測驗。儲存後按「發佈為目前測驗」。</span>';
      return;
    }
    el.innerHTML = `目前發佈：<strong>${escapeHtml(pub.title || pub.code)}</strong> <code>${escapeHtml(pub.code)}</code>
      <span class="muted">（${escapeHtml(formatHK(pub.publishedAt))}）</span>
      — 學生開 <code>student.html</code> 自動載入`;
  }

  // ——— student ———
  function studentPageUrl(code) {
    const withHash = studentLink(code || "_");
    const base = withHash.replace(/#q=.*/, "").replace(/\?.*$/, "");
    if (code) return base + "#q=" + encodeURIComponent(String(code).toUpperCase());
    return base;
  }

  function openStudent(code) {
    // Teacher page: never embed in-page answering — open dedicated student.html
    if (pageMode() === "teacher") {
      const url = studentPageUrl(code);
      window.open(url, "_blank", "noopener");

  function importAttemptsJson(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        const incoming = [];
        if (data && data.type === "qdcs_lite_attempt_v1" && data.attempt) incoming.push(data.attempt);
        else if (data && data.type === "qdcs_lite_attempts_bundle_v1" && Array.isArray(data.attempts)) incoming.push(...data.attempts);
        else if (Array.isArray(data)) incoming.push(...data);
        else if (data && data.id && data.code) incoming.push(data);
        else throw new Error("無法識別作答格式");
        const attempts = loadAttempts();
        let added = 0;
        incoming.forEach((att) => {
          if (!att || !att.id || !att.code) return;
          if (attempts.some((a) => a.id === att.id)) return;
          attempts.push(att);
          added++;
        });
        saveAttempts(attempts);
        toast("已匯入 " + added + " 筆作答（略過重複）");
        if (document.getElementById("analytics-code")) {
          renderAnalyticsSelect();
          renderAnalytics();
        }
      } catch (e) {
        toast("匯入失敗：" + e.message);
      }
    };
    reader.readAsText(file);
  }

  function formatHK(iso) {

  }

  function drawBarChart(canvas, values) {
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const W = canvas.width;
    const H = canvas.height;
    ctx.clearRect(0, 0, W, H);
    const pad = { t: 24, r: 16, b: 40, l: 40 };
    const plotW = W - pad.l - pad.r;
    const plotH = H - pad.t - pad.b;
    const n = values.length || 1;
    const gap = 8;
    const barW = Math.max(12, (plotW - gap * n) / n);

    // axes
    ctx.strokeStyle = "#c0cad6";
    ctx.beginPath();
    ctx.moveTo(pad.l, pad.t);
    ctx.lineTo(pad.l, pad.t + plotH);
    ctx.lineTo(pad.l + plotW, pad.t + plotH);
    ctx.stroke();

    // grid 0-100
    ctx.fillStyle = "#5a6a7a";
    ctx.font = "11px sans-serif";
    [0, 25, 50, 75, 100].forEach((v) => {
      const y = pad.t + plotH - (v / 100) * plotH;
      ctx.strokeStyle = "#e8eef4";
      ctx.beginPath();
      ctx.moveTo(pad.l, y);
      ctx.lineTo(pad.l + plotW, y);
      ctx.stroke();
      ctx.fillText(v + "%", 4, y + 4);
    });

    values.forEach((v, i) => {
      const h = (Math.min(100, Math.max(0, v)) / 100) * plotH;
      const x = pad.l + gap / 2 + i * (barW + gap);
      const y = pad.t + plotH - h;
      ctx.fillStyle = v >= 70 ? "#2e7d32" : v >= 40 ? "#1a5f7a" : "#c62828";
      ctx.fillRect(x, y, barW, h);
      ctx.fillStyle = "#1a2332";
      ctx.font = "11px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("Q" + (i + 1), x + barW / 2, pad.t + plotH + 16);
      ctx.fillText(v + "%", x + barW / 2, y - 4);
      ctx.textAlign = "left";
    });
  }

  // ——— export / import JSON + Drive-friendly downloads (no browser OAuth) ———
  function hkDateStamp() {
    try {
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Hong_Kong",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).formatToParts(new Date());
      const get = (t) => parts.find((p) => p.type === t).value;
      return get("year") + "-" + get("month") + "-" + get("day");
    } catch (e) {
      return new Date().toISOString().slice(0, 10);
    }
  }

  /** ASCII-safe, Drive-friendly file stem (no spaces/slashes). */
  function driveSafeStem(code, kind) {
    const c = String(code || "QUIZ")
      .toUpperCase()
      .replace(/[^A-Z0-9_-]/g, "")
      .slice(0, 24) || "QUIZ";
    const k = String(kind || "data").replace(/[^a-z0-9_-]/gi, "");
    return "QDCS-lite_" + c + "_" + k + "_" + hkDateStamp();
  }

  function downloadBlob(filename, blob) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function resolveQuizForExport() {
    const sel = document.getElementById("drive-export-code");
    const codeFromDrive = sel && sel.value;
    const code =
      (editQuiz && editQuiz.code) ||
      codeFromDrive ||
      (document.getElementById("analytics-code") && document.getElementById("analytics-code").value);
    const map = loadQuizzes();
    if (editQuiz && (!codeFromDrive || codeFromDrive === editQuiz.code)) return editQuiz;
    return code ? map[code] : null;
  }

  function exportQuizJson() {
    const q = resolveQuizForExport();
    if (!q) {
      toast("請先選擇或儲存測驗");
      return;
    }
    const name = driveSafeStem(q.code, "quiz") + ".json";
    const payload = Object.assign({}, q, {
      _exportMeta: {
        app: "QDCS-lite",
        exportedAt: new Date().toISOString(),
        timezoneNote: "Asia/Hong_Kong",
        driveHint: "Upload this JSON to Google Drive via assistant or manual upload; site has no OAuth."
      }
    });
    downloadBlob(name, new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" }));
    toast("已下載 " + name);
    updateDriveFilenameHint(q.code);
  }

  function csvEscape(v) {
    const s = String(v == null ? "" : v);
    if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  function exportAttemptsCsv() {
    const q = resolveQuizForExport();
    if (!q) {
      toast("請先選擇測驗");
      return;
    }
    const attempts = loadAttempts().filter((a) => a.code === q.code);
    const nQ = (q.questions || []).length;
    const headers = ["exportedAt_HK", "attemptAt", "code", "name", "score", "max", "percent"];
    for (let i = 0; i < nQ; i++) headers.push("Q" + (i + 1) + "_score");
    const rows = [headers.join(",")];
    const exportedAt = formatHK(new Date().toISOString());
    if (!attempts.length) {
      rows.push([csvEscape(exportedAt), "", csvEscape(q.code), "(no attempts yet)", "0", "0", "0"].join(","));
    } else {
      attempts.forEach((a) => {
        const cells = [
          csvEscape(exportedAt),
          csvEscape(formatHK(a.at)),
          csvEscape(a.code),
          csvEscape(a.name),
          a.score,
          a.max,
          a.percent
        ];
        for (let i = 0; i < nQ; i++) {
          const d = (a.details || [])[i];
          cells.push(d ? d.score : "");
        }
        rows.push(cells.map(csvEscape).join(","));
      });
    }
    const name = driveSafeStem(q.code, "attempts") + ".csv";
    downloadBlob(name, new Blob(["\ufeff" + rows.join("\n")], { type: "text/csv;charset=utf-8" }));
    toast("已下載 " + name + "（" + attempts.length + " 筆）");
    updateDriveFilenameHint(q.code);
  }

      "This static site CANNOT call your Google Drive from the browser (no OAuth).\n" +
      "Teacher steps:\n" +
      "1. Download " + quizName + " (quiz JSON)\n" +
      "2. Optional: download " + csvName + " (attempts for Sheets)\n" +
      "3. Upload files to Drive yourself, OR ask workshop AI / Grok Bot to upload the package folder.\n\n" +
      "Suggested Drive folder name: QDCS-lite_exports\n" +
      "Site package folder on disk: simulators/qdcs-lite/ (or drive-export/ snapshot)\n\n" +
      "Do not expect a Sign in with Google button inside index.html for this MVP.\n";
    const name = driveSafeStem(code, "DRIVE-README") + ".txt";
    downloadBlob(name, new Blob([text], { type: "text/plain;charset=utf-8" }));
    toast("已下載 " + name);
  }

  function updateDriveFilenameHint(code) {
    const el = document.getElementById("drive-filename-hint");
    if (!el) return;
    const c = code || (document.getElementById("drive-export-code") || {}).value || "BIODEMO";
    el.innerHTML =
      "建議檔名（Drive-friendly）：<br>" +
      "<code>" + escapeHtml(driveSafeStem(c, "quiz") + ".json") + "</code><br>" +
      "<code>" + escapeHtml(driveSafeStem(c, "attempts") + ".csv") + "</code><br>" +
      "<code>" + escapeHtml(driveSafeStem(c, "DRIVE-README") + ".txt") + "</code>";
  }

  function refreshDriveExportSelect() {
    const sel = document.getElementById("drive-export-code");
    if (!sel) return;
    const map = loadQuizzes();
    const cur = sel.value;
    sel.innerHTML =
      '<option value="">— 選擇測驗 —</option>' +
      Object.keys(map)
        .map((c) => '<option value="' + escapeHtml(c) + '">' + escapeHtml(map[c].title || c) + " (" + escapeHtml(c) + ")</option>")
        .join("");
    if (cur && map[cur]) sel.value = cur;
    else if (map.BIODEMO) sel.value = "BIODEMO";
    updateDriveFilenameHint(sel.value || "BIODEMO");
  }


  function importQuizJsonFile(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const q = JSON.parse(reader.result);
        if (!q.code || !q.questions) throw new Error("格式不符");
        const map = loadQuizzes();
        map[q.code] = q;
        saveQuizzes(map);
        toast("已匯入測驗 " + q.code);
        renderHome();
        renderTeacherList();
      } catch (e) {
        toast("JSON 無效：" + e.message);
      }
    };
    reader.readAsText(file);
  }

  // ——— mammoth (DOCX) + pdf.js (PDF text layer; no OCR) ———
  function loadDocx(file) {
    if (typeof mammoth === "undefined") {
      toast("mammoth.js 未載入，請改用貼上文字");
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      mammoth
        .extractRawText({ arrayBuffer: reader.result })
        .then((res) => {
          document.getElementById("import-text").value = res.value || "";
          toast("已擷取 .docx 文字（僅純文字，無 OCR）");
          runImport();
        })
        .catch(() => toast("無法讀取 docx"));
    };
    reader.readAsArrayBuffer(file);
  }

  function ensurePdfJs() {
    return new Promise((resolve, reject) => {
      if (typeof pdfjsLib !== "undefined") return resolve(pdfjsLib);
      const s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js";
      s.onload = () => {
        try {
          pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
          resolve(pdfjsLib);
        } catch (e) {
          reject(e);
        }
      };
      s.onerror = () => reject(new Error("pdf.js 載入失敗"));
      document.head.appendChild(s);
    });
  }

  function loadPdf(file) {
    const reader = new FileReader();
    reader.onload = () => {
      const data = reader.result;
      ensurePdfJs()
        .then((pdfjs) => pdfjs.getDocument({ data: data }).promise)
        .then(async (pdf) => {
          const maxPages = Math.min(pdf.numPages, 12);
          const pageInfos = [];
          let totalImgs = 0;
          setImportStatus("正在擷取 PDF 文字層與內嵌圖…");
          for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const tc = await page.getTextContent();
            const line = tc.items.map((it) => it.str).join(" ");
            let images = [];
            if (totalImgs < QDCS_PDF_IMG_MAX_TOTAL) {
              images = await extractPdfPageImages(page, pdfjs);
              const room = QDCS_PDF_IMG_MAX_TOTAL - totalImgs;
              if (images.length > room) images = images.slice(0, room);
              totalImgs += images.length;
            }
            pageInfos.push({ page: i, text: line, images: images });
          }
          let text = pageInfos.map((p) => p.text).join("\n\n").replace(/[ \t]+/g, " ").trim();
          let usedOcr = false;

          if (textLooksSparse(text)) {
            usedOcr = true;
            setImportStatus(
              "文字層不足，啟用掃描／圖片 OCR（Tesseract CDN；最多 " + maxPages + " 頁）…"
            );
            const ocrParts = [];
            for (let i = 1; i <= maxPages; i++) {
              const page = await pdf.getPage(i);
              const canvas = await renderPdfPageToCanvas(page, 2);
              const pageText = await ocrCanvasOrImage(canvas, "第 " + i + "/" + maxPages + " 頁 OCR");
              ocrParts.push(pageText.trim());
              if (pageInfos[i - 1]) pageInfos[i - 1].text = pageText.trim() || pageInfos[i - 1].text;
              if (
                pageInfos[i - 1] &&
                (!pageInfos[i - 1].images || !pageInfos[i - 1].images.length) &&
                pageLooksFigureHeavy(pageInfos[i - 1].text, 0) &&
                totalImgs < QDCS_PDF_IMG_MAX_TOTAL
              ) {
                try {
                  let dw = canvas.width;
                  let dh = canvas.height;
                  const longest = Math.max(dw, dh);
                  let shot = canvas;
                  if (longest > QDCS_PDF_IMG_MAX_SIDE) {
                    const s = QDCS_PDF_IMG_MAX_SIDE / longest;
                    const c2 = document.createElement("canvas");
                    c2.width = Math.max(1, Math.round(dw * s));
                    c2.height = Math.max(1, Math.round(dh * s));
                    c2.getContext("2d").drawImage(canvas, 0, 0, c2.width, c2.height);
                    shot = c2;
                  }
                  if (shot.width >= QDCS_PDF_IMG_MIN_PX && shot.height >= QDCS_PDF_IMG_MIN_PX) {
                    const url = shot.toDataURL("image/jpeg", QDCS_PDF_IMG_JPEG_Q);
                    if (isSafeImageDataUrl(url)) {
                      pageInfos[i - 1].images = [url];
                      totalImgs += 1;
                    }
                  }
                } catch (eShot) {}
              }
            }
            text = ocrParts.filter(Boolean).join("\n\n").trim();
          }

          window._qdcsPdfImport = { pages: pageInfos, totalImages: totalImgs };
          document.getElementById("import-text").value = text || "";
          if (!text) {
            setImportStatus("未辨識到文字。請改用更清晰掃描或手動貼上。" + (totalImgs ? "（已擷取 " + totalImgs + " 張內嵌圖）" : ""));
          } else {
            const imgNote = totalImgs ? " · 內嵌圖 " + totalImgs + " 張（簡化對位）" : " · 無內嵌圖";
            setImportStatus(
              (usedOcr
                ? "掃描／圖片 OCR 完成（簡化、準確度有限）· 已處理 " + maxPages + "/" + pdf.numPages + " 頁"
                : "已擷取 PDF 文字層（非 OCR）· " + pdf.numPages + " 頁") +
                imgNote +
                " — 請檢查後再解析"
            );
            runImport();
          }
        })
        .catch((e) => {
          setImportStatus("無法讀取 PDF：" + (e && e.message ? e.message : "請改貼上文字"));
        });
    };
    reader.readAsArrayBuffer(file);
  }


  function init() {
    ensureSample();

    document.querySelectorAll(".nav-btn").forEach((b) =>
      b.addEventListener("click", () => showPanel(b.dataset.panel))
    );

    document.getElementById("btn-new-quiz").onclick = () => startEdit(null);
    document.getElementById("btn-add-q").onclick = () => {
      if (!editQuiz) startEdit(null);
      const type = document.getElementById("new-q-type").value;
      editQuiz.questions.push(blankQuestion(type));
      renderBuilderQuestions();
    };
    document.getElementById("btn-save-quiz").onclick = saveCurrentQuiz;
    document.getElementById("btn-cancel-builder").onclick = () => {
      document.getElementById("builder-wrap").classList.add("hidden");
      editQuiz = null;
    };
    document.getElementById("btn-load-sample").onclick = () => {
      ensureSample();
      const map = loadQuizzes();
      // refresh sample from built-in
      if (window.QDCS_SAMPLE_QUIZ) {
        map.BIODEMO = JSON.parse(JSON.stringify(window.QDCS_SAMPLE_QUIZ));
        saveQuizzes(map);
      }
      toast("已載入示範卷 BIODEMO");
      renderHome();
      renderTeacherList();
    };

    document.getElementById("btn-join").onclick = () => {
      const c = document.getElementById("join-code").value.trim().toUpperCase();
      openStudent(c);
    };
    document.getElementById("join-code").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("btn-join").click();
    });

    document.getElementById("analytics-code").onchange = renderAnalytics;
    document.getElementById("btn-refresh-analytics").onclick = renderAnalytics;

    document.getElementById("btn-parse-import").onclick = runImport;
    document.getElementById("btn-import-apply").onclick = applyImport;

    document.getElementById("import-file").onchange = (e) => {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      const isPdf = /\.pdf$/i.test(f.name);
      if (!isPdf) window._qdcsPdfImport = null;
      if (/\.docx$/i.test(f.name)) loadDocx(f);
      else if (isPdf) loadPdf(f);
      else {
        const reader = new FileReader();
        reader.onload = () => {
          document.getElementById("import-text").value = reader.result;
          runImport();
        };
        reader.readAsText(f);
      }
    };

    document.getElementById("btn-export-json").onclick = exportQuizJson;
    document.getElementById("import-json-file").onchange = (e) => {
      const f = e.target.files && e.target.files[0];
      if (f) importQuizJsonFile(f);
    };

    const btnDriveJson = document.getElementById("btn-drive-json");
    if (btnDriveJson) btnDriveJson.onclick = exportQuizJson;
    const btnDriveCsv = document.getElementById("btn-drive-csv");
    if (btnDriveCsv) btnDriveCsv.onclick = exportAttemptsCsv;
    const btnDriveReadme = document.getElementById("btn-drive-readme");
    if (btnDriveReadme) btnDriveReadme.onclick = exportDriveReadme;
    const driveSel = document.getElementById("drive-export-code");
    if (driveSel) driveSel.onchange = () => updateDriveFilenameHint(driveSel.value);
    const btnCsvAnal = document.getElementById("btn-export-csv-analytics");
    if (btnCsvAnal) {
      btnCsvAnal.onclick = () => {
        const ac = document.getElementById("analytics-code");
        const ds = document.getElementById("drive-export-code");
        if (ds && ac && ac.value) ds.value = ac.value;
        exportAttemptsCsv();
      };
    }
    const btnBundle = document.getElementById("btn-export-attempts-json");
    if (btnBundle) btnBundle.onclick = exportAllAttemptsBundle;
    const importAtt = document.getElementById("import-attempts-file");
    if (importAtt) {
      importAtt.onchange = (e) => {
        const f = e.target.files && e.target.files[0];
        if (f) importAttemptsJson(f);
        importAtt.value = "";
      };
    }
    // Live sync: other tab (student) writes attempts → refresh analytics if open
    window.addEventListener("storage", (ev) => {
      if (ev.key !== LS_ATTEMPTS) return;
      if (pageMode() === "teacher" || pageMode() === "hub") {
        const panel = document.getElementById("panel-analytics");
        if (panel && panel.classList.contains("active")) renderAnalytics();
        toast("偵測到新作答（其他分頁已同步）");
      }
    });

    const mode = pageMode();
    document.body.setAttribute("data-mode", mode);
    const fromUrl = getShareFromUrl();

    if (mode === "student") {
      document.querySelectorAll(".nav-bar, #panel-home, #panel-teacher, #panel-import, #panel-analytics, #panel-drive, .legend-teacher").forEach((el) => {
        if (el) el.classList.add("hidden");
      });
      const hub = document.getElementById("hub-landing");
      if (hub) hub.classList.add("hidden");
      showPanel("student");
      const boot = () => {
        if (fromUrl) {
          openStudent(fromUrl);
          return;
        }
        const pub = getPublished();
        if (pub && pub.quiz) {
          openStudent(pub.code || pub.quiz.code);
          return;
        }
        // show enter UI already in DOM; update status
        const st = document.getElementById("student-pub-status");
        if (st) st.textContent = "老師尚未發佈「目前測驗」。請稍候，或使用備用分享碼。";
      };
      setTimeout(boot, 0);
      return;
    }

    if (mode === "teacher") {
      const hub = document.getElementById("hub-landing");
      if (hub) hub.classList.add("hidden");
      document.querySelectorAll('.nav-btn[data-panel="student"], .nav-btn[data-panel="home"]').forEach((b) => b.classList.add("hidden"));
      const stuPanel = document.getElementById("panel-student");
      if (stuPanel) {
        stuPanel.classList.add("hidden");
        stuPanel.setAttribute("aria-hidden", "true");
        stuPanel.innerHTML = ""; // never render student answering form inside teacher
      }
      showPanel("teacher");
      updatePublishBanner();
      return;
    }

    // hub / all-in-one landing
    if (fromUrl) {
      const hub = document.getElementById("hub-landing");
      if (hub) hub.classList.add("hidden");
      showPanel("student");
      setTimeout(() => openStudent(fromUrl), 0);
    } else {
      const hub = document.getElementById("hub-landing");
      if (hub) {
        document.querySelectorAll(".panel").forEach((p) => p.classList.remove("active"));
        hub.classList.remove("hidden");
      } else {
        showPanel("home");
      }
    }
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();

</script>
