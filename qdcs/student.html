<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QDCS-lite｜學生作答版 — 香港中學科學</title>
<style>
/* QDCS-lite — clean color-card layout (HK TC) */
:root {
  --bg: #f0f2f5;
  --ink: #1a2332;
  --muted: #5a6a7a;
  --card: #fff;
  --border: #d8dee6;
  --radius: 12px;
  --shadow: 0 1px 4px rgba(26,35,50,.06);
  --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Heiti TC", "Segoe UI", sans-serif;
  /* Section colors */
  --blue: #1565c0;
  --blue-bg: #e8f1fb;
  --blue-border: #90caf9;
  --green: #2e7d32;
  --green-bg: #e8f5e9;
  --green-border: #a5d6a7;
  --amber: #b8860b;
  --amber-bg: #fff8e6;
  --amber-border: #e8d48a;
  --purple: #6a1b9a;
  --purple-bg: #f3e5f5;
  --purple-border: #ce93d8;
  --ok: #2e7d32;
  --ok-bg: #e8f5e9;
  --danger: #c62828;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  line-height: 1.5;
  font-size: 15px;
}
.wrap { max-width: 880px; margin: 0 auto; padding: 14px 12px 48px; }
a { color: var(--blue); }

header.app-header {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
}
header.app-header h1 { margin: 0 0 4px; font-size: 1.2rem; font-weight: 700; }
header.app-header .sub { margin: 0; color: var(--muted); font-size: .85rem; }
.badge-lite {
  display: inline-block;
  background: #eee;
  color: var(--muted);
  padding: 1px 7px;
  border-radius: 4px;
  font-size: .72rem;
  margin-left: 6px;
  vertical-align: middle;
  font-weight: 600;
}

/* Color legend */
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 12px;
  font-size: .8rem;
}
.legend span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 4px 10px;
}
.legend i {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
}
.legend i.blue { background: var(--blue); }
.legend i.green { background: var(--green); }
.legend i.amber { background: var(--amber); }
.legend i.purple { background: var(--purple); }

.assumption {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 12px;
  margin-bottom: 12px;
  font-size: .8rem;
  color: var(--muted);
}

.nav-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 12px;
}
.nav-btn, .btn {
  border: 1px solid var(--border);
  background: #fff;
  border-radius: 8px;
  cursor: pointer;
  font-family: inherit;
  font-size: .86rem;
  font-weight: 600;
  color: var(--ink);
  padding: 8px 12px;
}
.nav-btn:hover, .btn:hover { filter: brightness(.97); }
.nav-btn.active { color: #fff; border-color: transparent; }
.nav-btn[data-panel="home"].active { background: #455a64; }
.nav-btn[data-panel="teacher"].active,
.nav-btn[data-panel="import"].active { background: var(--blue); }
.nav-btn[data-panel="student"].active { background: var(--green); }
.nav-btn[data-panel="analytics"].active { background: var(--amber); color: #1a2332; }
.nav-btn[data-panel="drive"].active { background: var(--purple); }

.btn-primary { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn-success { background: var(--green); border-color: var(--green); color: #fff; }
.btn-amber { background: var(--amber); border-color: var(--amber); color: #1a2332; }
.btn-purple { background: var(--purple); border-color: var(--purple); color: #fff; }
.btn-danger { background: #fff; border-color: var(--danger); color: var(--danger); }
.btn-sm { padding: 5px 9px; font-size: .8rem; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.panel { display: none; }
.panel.active { display: block; }

/* Colored section cards */
.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  border-left-width: 5px;
}
.card h2 {
  margin: 0 0 8px;
  font-size: 1.05rem;
  display: flex;
  align-items: center;
  gap: 8px;
}
.card h3 { margin: 12px 0 6px; font-size: .95rem; }
.card.tone-blue { border-left-color: var(--blue); background: linear-gradient(90deg, var(--blue-bg) 0%, #fff 48%); }
.card.tone-blue h2 { color: var(--blue); }
.card.tone-green { border-left-color: var(--green); background: linear-gradient(90deg, var(--green-bg) 0%, #fff 48%); }
.card.tone-green h2 { color: var(--green); }
.card.tone-amber { border-left-color: var(--amber); background: linear-gradient(90deg, var(--amber-bg) 0%, #fff 48%); }
.card.tone-amber h2 { color: #8a6d00; }
.card.tone-purple { border-left-color: var(--purple); background: linear-gradient(90deg, var(--purple-bg) 0%, #fff 48%); }
.card.tone-purple h2 { color: var(--purple); }
.card.tone-neutral { border-left-color: #90a4ae; }

.dot {
  width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex-shrink: 0;
}
.dot.blue { background: var(--blue); }
.dot.green { background: var(--green); }
.dot.amber { background: var(--amber); }
.dot.purple { background: var(--purple); }

.muted { color: var(--muted); font-size: .84rem; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } }

label.field {
  display: block;
  margin-bottom: 8px;
  font-size: .84rem;
  font-weight: 600;
}
label.field input, label.field select, label.field textarea,
.field-input, .field-select, .field-textarea {
  display: block;
  width: 100%;
  margin-top: 3px;
  padding: 7px 9px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-family: inherit;
  font-size: .9rem;
  font-weight: 400;
  background: #fff;
}
textarea { min-height: 72px; resize: vertical; }

.q-block {
  border: 1px solid var(--blue-border);
  border-radius: 8px;
  padding: 10px;
  margin-bottom: 10px;
  background: #fff;
}
.q-block .q-head {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  margin-bottom: 6px;
}
.q-block .q-num {
  background: var(--blue-bg);
  color: var(--blue);
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 4px;
  font-size: .8rem;
}
.opt-row { display: flex; gap: 6px; align-items: center; margin-bottom: 5px; }
.opt-row input[type="text"] { flex: 1; }

.share-box {
  background: var(--blue-bg);
  border: 1px dashed var(--blue);
  border-radius: 8px;
  padding: 10px;
  margin-top: 8px;
  word-break: break-all;
  font-size: .88rem;
}
.share-box code { background: #fff; padding: 1px 5px; border-radius: 3px; }

.table-wrap { overflow-x: auto; }
table.scores { width: 100%; border-collapse: collapse; font-size: .84rem; background: #fff; }
table.scores th, table.scores td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; }
table.scores th { background: var(--amber-bg); }

.chart-wrap {
  background: #fff;
  border: 1px solid var(--amber-border);
  border-radius: 8px;
  padding: 10px;
  margin: 10px 0;
}
.chart-wrap canvas { max-width: 100%; display: block; margin: 0 auto; }

.stat-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.stat-pill {
  background: #fff;
  border: 1px solid var(--amber-border);
  border-radius: 8px;
  padding: 8px 12px;
  min-width: 100px;
}
.stat-pill .val { font-size: 1.25rem; font-weight: 700; color: #8a6d00; }
.stat-pill .lbl { font-size: .72rem; color: var(--muted); }

.student-q {
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--green-border);
}
.student-q .stem { font-weight: 600; margin-bottom: 6px; }
.choice-label {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  padding: 7px 9px;
  border: 1px solid var(--border);
  border-radius: 6px;
  margin-bottom: 5px;
  cursor: pointer;
  background: #fff;
}
.choice-label:hover { border-color: var(--green); }
.choice-label.correct-mark { background: var(--ok-bg); border-color: var(--ok); }
.choice-label.wrong-mark { background: #ffebee; border-color: var(--danger); }

.result-banner {
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 12px;
  font-weight: 600;
}
.result-banner.pass { background: var(--ok-bg); color: var(--ok); border: 1px solid #a5d6a7; }
.result-banner.review { background: var(--amber-bg); color: #5c4a1a; border: 1px solid var(--amber-border); }

.quiz-list-item {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
}
.quiz-list-item:last-child { border-bottom: none; }

.tag {
  display: inline-block;
  font-size: .7rem;
  padding: 1px 5px;
  border-radius: 3px;
  background: #eee;
  color: var(--muted);
  margin-left: 3px;
}
.tag.mcq { background: #e3f2fd; color: #1565c0; }
.tag.tf { background: #f3e5f5; color: #7b1fa2; }
.tag.fill { background: #fff3e0; color: #e65100; }
.tag.sa { background: #e8f5e9; color: #2e7d32; }

.import-preview {
  max-height: 240px;
  overflow-y: auto;
  background: #fff;
  border: 1px solid var(--blue-border);
  border-radius: 6px;
  padding: 8px;
  font-size: .82rem;
  white-space: pre-wrap;
}

.drive-hint {
  background: #fff;
  border: 1px solid var(--purple-border);
  border-radius: 8px;
  padding: 10px;
  font-size: .84rem;
  margin: 8px 0;
}
.drive-hint code { background: var(--purple-bg); padding: 1px 5px; border-radius: 3px; word-break: break-all; }

.flex-gap { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.hidden { display: none !important; }

.toast {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #263238;
  color: #fff;
  padding: 10px 14px;
  border-radius: 8px;
  z-index: 100;
  display: none;
  max-width: 300px;
  font-size: .86rem;
}
.toast.show { display: block; }

footer.app-foot {
  margin-top: 20px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
  font-size: .75rem;
  color: var(--muted);
  text-align: center;
}


/* Split mode extras */
.hub-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
@media (max-width: 640px) { .hub-grid { grid-template-columns: 1fr; } }
.hub-card {
  display: block; text-decoration: none; color: inherit;
  border-radius: 12px; padding: 18px 16px; border: 1px solid var(--border);
  border-left-width: 6px; background: #fff; box-shadow: var(--shadow);
  transition: transform .12s, box-shadow .12s;
}
.hub-card:hover { transform: translateY(-2px); box-shadow: 0 4px 14px rgba(26,35,50,.1); }
.hub-card.teacher { border-left-color: var(--blue); background: linear-gradient(90deg, var(--blue-bg), #fff 55%); }
.hub-card.student { border-left-color: var(--green); background: linear-gradient(90deg, var(--green-bg), #fff 55%); }
.hub-card h2 { margin: 0 0 6px; font-size: 1.15rem; }
.hub-card.teacher h2 { color: var(--blue); }
.hub-card.student h2 { color: var(--green); }
.hub-card p { margin: 0; color: var(--muted); font-size: .88rem; }
body[data-mode="student"] .wrap { max-width: 720px; }
body[data-mode="student"] header.app-header { border-left: 5px solid var(--green); }
body[data-mode="teacher"] header.app-header { border-left: 5px solid var(--blue); }
.mode-pill { font-size: .75rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-left: 6px; vertical-align: middle; }
.mode-pill.teacher { background: var(--blue-bg); color: var(--blue); }
.mode-pill.student { background: var(--green-bg); color: var(--green); }

</style>
</head>
<body data-mode="student">
<div class="wrap">

  <header class="app-header">
    <h1>QDCS-lite 學生作答版<span class="mode-pill student">學生</span></h1>
    <p class="sub">輸入姓名 · 作答 · 提交後自動評分（客觀題）</p>
  </header>
  <div class="legend">
    <span><i class="green"></i>學生作答（綠）</span>
  </div>
  <p class="assumption">請使用老師提供的連結 <code>student.html#q=分享碼</code>，或在下方輸入分享碼。須與老師<strong>同一瀏覽器資料</strong>（或已匯入同一份測驗 JSON）。</p>

  <nav class="nav-bar hidden" aria-hidden="true">
    <button type="button" class="nav-btn" data-panel="student">學生作答</button>
  </nav>

  <section id="panel-student" class="panel active">
    <div id="student-root">
      <div class="card tone-green">
        <h2><span class="dot green"></span>進入測驗</h2>
        <label class="field">分享碼
          <input type="text" id="join-code-stu" class="field-input" placeholder="例如 BIODEMO" maxlength="12" />
        </label>
        <div class="flex-gap">
          <button type="button" class="btn btn-success" id="btn-enter-stu">開始作答</button>
        </div>
      </div>
    </div>
  </section>

  <!-- stubs -->
  <section id="panel-home" class="panel hidden"></section>
  <section id="panel-teacher" class="panel hidden">
    <div id="builder-wrap" class="hidden"></div>
    <div id="teacher-list"></div>
    <input id="bq-title" /><input id="bq-subject" /><textarea id="bq-desc"></textarea>
    <span id="bq-code"></span><div id="builder-questions"></div><div id="share-area"></div>
    <button id="btn-new-quiz"></button><button id="btn-add-q"></button>
    <button id="btn-save-quiz"></button><button id="btn-cancel-builder"></button>
    <select id="new-q-type"></select>
    <button id="btn-export-json"></button>
    <input type="file" id="import-json-file" />
  </section>
  <section id="panel-import" class="panel hidden">
    <input type="file" id="import-file" /><textarea id="import-text"></textarea>
    <button id="btn-parse-import"></button><button id="btn-import-apply"></button>
    <div id="import-preview"></div>
  </section>
  <section id="panel-analytics" class="panel hidden">
    <select id="analytics-code"></select>
    <button id="btn-refresh-analytics"></button>
    <button id="btn-export-csv-analytics"></button>
    <div id="analytics-out"></div>
  </section>
  <section id="panel-drive" class="panel hidden">
    <button id="btn-load-sample"></button>
    <select id="drive-export-code"></select>
    <button id="btn-drive-json"></button><button id="btn-drive-csv"></button>
    <button id="btn-drive-readme"></button>
    <div id="drive-filename-hint"></div>
  </section>
  <input type="text" id="join-code" class="hidden" />
  <button type="button" id="btn-join" class="hidden"></button>

  <footer class="app-foot">學生作答版 · 老師請用 <a href="teacher.html">teacher.html</a></footer>
  <script>
  document.addEventListener("DOMContentLoaded", function () {
    var btn = document.getElementById("btn-enter-stu");
    if (btn) btn.addEventListener("click", function () {
      var c = (document.getElementById("join-code-stu").value || "").trim().toUpperCase();
      document.getElementById("join-code").value = c;
      document.getElementById("btn-join").click();
    });
    var inp = document.getElementById("join-code-stu");
    if (inp) inp.addEventListener("keydown", function (e) {
      if (e.key === "Enter") btn && btn.click();
    });
  });
  </script>

</div>
<div id="toast" class="toast" role="status"></div>

<script>
/**
 * Built-in sample quiz: hydrostatic / fluid pressure & osmotic pressure
 * Themes: capillary arteriole–venule exchange; potato × sucrose osmosis
 */
window.QDCS_SAMPLE_QUIZ = {
  id: "sample-fluid-osmotic",
  code: "BIODEMO",
  title: "流體壓力與滲透壓（示範卷）Fluid & Osmotic Pressure Sample",
  subject: "生物 Biology",
  description: "配合微血管組織液交換與馬鈴薯×蔗糖滲透模擬器之課堂小測。Auto-mark objective items; short answers use keywords.",
  createdAt: "2026-10-21T00:00:00+08:00",
  questions: [
    {
      id: "q1",
      type: "mcq",
      stem: "在微血管動脈端（arteriole end），下列哪一項通常較大，因而以過濾（filtration）為主？",
      options: [
        "靜水壓 hydrostatic pressure",
        "膠體滲透壓 oncotic / osmotic pressure",
        "大氣壓 atmospheric pressure",
        "細胞內壓 turgor pressure"
      ],
      answer: 0,
      marks: 1,
      explanation: "動脈端靜水壓通常高於膠體滲透壓，液體由微血管濾出至組織間隙。"
    },
    {
      id: "q2",
      type: "mcq",
      stem: "在微血管靜脈端（venule end），相對較強的力量是：",
      options: [
        "靜水壓遠高於滲透壓 → 持續過濾",
        "膠體滲透壓相對較顯著 → 重吸收 reabsorption",
        "只有重力作用",
        "完全沒有淨流動"
      ],
      answer: 1,
      marks: 1,
      explanation: "沿微血管靜水壓下降，靜脈端膠體滲透壓相對較重要，促成重吸收。"
    },
    {
      id: "q3",
      type: "tf",
      stem: "組織液（tissue fluid）的形成與靜水壓、滲透壓的淨合力有關。",
      answer: true,
      marks: 1,
      explanation: "正確。淨過濾壓 ≈ 靜水壓差 − 滲透壓差（簡化模型）。"
    },
    {
      id: "q4",
      type: "tf",
      stem: "植物細胞放入高滲透壓（hypertonic）蔗糖溶液中，細胞通常會吸水膨脹。",
      answer: false,
      marks: 1,
      explanation: "錯誤。高滲（高蔗糖濃度）環境下水勢較低，細胞失水，可能出現質壁分離 plasmolysis。"
    },
    {
      id: "q5",
      type: "fill",
      stem: "馬鈴薯塊浸於高濃度蔗糖溶液後質量減少，主要因為水分子經 ______ 由高水勢移向低水勢。（填英文或中文關鍵詞）",
      answer: ["osmosis", "滲透", "滲透作用"],
      marks: 1,
      explanation: "水以滲透（osmosis）離開細胞／組織。"
    },
    {
      id: "q6",
      type: "fill",
      stem: "微血管壁容許水及小分子通過，但一般不容許大分子 ______ 輕易通過，因而維持血漿膠體滲透壓。",
      answer: ["蛋白質", "protein", "plasma protein", "血漿蛋白", "albumin"],
      marks: 1,
      explanation: "血漿蛋白（如白蛋白）是膠體滲透壓的主要來源。"
    },
    {
      id: "q7",
      type: "sa",
      stem: "簡述為何動脈端以過濾為主、靜脈端以重吸收為主。（可用關鍵詞：hydrostatic / osmotic）",
      answerKeywords: ["靜水壓", "hydrostatic", "滲透", "osmotic", "過濾", "filtration", "重吸收", "reabsorption", "下降", "decrease"],
      marks: 2,
      explanation: "動脈端靜水壓高 → 過濾；沿管靜水壓下降，靜脈端滲透壓相對重要 → 重吸收。評分以關鍵詞為準（簡化）。"
    },
    {
      id: "q8",
      type: "sa",
      stem: "解釋馬鈴薯×不同濃度蔗糖實驗中，質量變化如何反映水勢差。",
      answerKeywords: ["水勢", "water potential", "濃度", "concentration", "失水", "吸水", "osmosis", "滲透", "isotonic", "等滲"],
      marks: 2,
      explanation: "高蔗糖 → 外液水勢低 → 失水質量減；低蔗糖／清水 → 吸水質量增；接近等滲則變化少。"
    }
  ]
};

</script>
<script>
/**
 * QDCS-lite — educational quiz MVP for HK secondary science
 * Data: localStorage only. No paid APIs.
 */
(function () {
  "use strict";

  const LS_QUIZZES = "qdcs_lite_quizzes_v1";
  const LS_ATTEMPTS = "qdcs_lite_attempts_v1";

  const TYPE_LABEL = {
    mcq: "多項選擇 MCQ",
    tf: "是非 T/F",
    fill: "填充 Fill-in",
    sa: "短答 Short answer"
  };

  // ——— storage ———
  function loadQuizzes() {
    try {
      const raw = localStorage.getItem(LS_QUIZZES);
      return raw ? JSON.parse(raw) : {};
    } catch (e) {
      return {};
    }
  }
  function saveQuizzes(map) {
    localStorage.setItem(LS_QUIZZES, JSON.stringify(map));
  }
  function loadAttempts() {
    try {
      const raw = localStorage.getItem(LS_ATTEMPTS);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }
  function saveAttempts(arr) {
    localStorage.setItem(LS_ATTEMPTS, JSON.stringify(arr));
  }

  function ensureSample() {
    const map = loadQuizzes();
    if (!map.BIODEMO && window.QDCS_SAMPLE_QUIZ) {
      const s = JSON.parse(JSON.stringify(window.QDCS_SAMPLE_QUIZ));
      map[s.code] = s;
      saveQuizzes(map);
    }
  }

  function genCode() {
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let c = "";
    for (let i = 0; i < 6; i++) c += chars[Math.floor(Math.random() * chars.length)];
    const map = loadQuizzes();
    return map[c] ? genCode() : c;
  }

  function uid(prefix) {
    return (prefix || "id") + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.classList.remove("show"), 2800);
  }

  function showPanel(name) {
    document.querySelectorAll(".panel").forEach((p) => p.classList.remove("active"));
    document.querySelectorAll(".nav-btn").forEach((b) => b.classList.remove("active"));
    const panel = document.getElementById("panel-" + name);
    if (panel) panel.classList.add("active");
    const btn = document.querySelector('.nav-btn[data-panel="' + name + '"]');
    if (btn) btn.classList.add("active");
    if (name === "home") renderHome();
    if (name === "teacher") renderTeacherList();
    if (name === "analytics") renderAnalyticsSelect();
    if (name === "drive") refreshDriveExportSelect();
  }

  // ——— URL share ———
  function getShareFromUrl() {
    const hash = location.hash.replace(/^#/, "");
    const params = new URLSearchParams(hash.includes("=") ? hash : "");
    // support #q=CODE or #CODE or ?q=CODE
    let code = params.get("q") || params.get("code");
    if (!code && hash && !hash.includes("=")) code = hash.toUpperCase();
    const qs = new URLSearchParams(location.search);
    if (!code) code = qs.get("q") || qs.get("code");
    return code ? code.toUpperCase() : null;
  }

  function studentLink(code) {
    // Prefer dedicated student page when present (same folder / same origin → shared localStorage)
    const here = location.href.split("#")[0].split("?")[0];
    let studentBase = here;
    if (/teacher\.html$/i.test(here) || /index\.html$/i.test(here) || /qdcs-lite-single\.html$/i.test(here) || /qdcs-lite-all-in-one\.html$/i.test(here)) {
      studentBase = here.replace(/[^/]+$/, "student.html");
    } else if (/teacher\.html$/i.test(location.pathname)) {
      studentBase = here.replace(/teacher\.html$/i, "student.html");
    }
    // If already on student.html, keep it
    if (/student\.html$/i.test(here)) studentBase = here;
    return studentBase + "#q=" + encodeURIComponent(code);
  }

  function teacherLink() {
    const here = location.href.split("#")[0].split("?")[0];
    if (/student\.html$/i.test(here)) return here.replace(/student\.html$/i, "teacher.html");
    if (/[^/]+$/.test(here)) return here.replace(/[^/]+$/, "teacher.html");
    return here;
  }

  function pageMode() {
    if (window.QDCS_PAGE_MODE) return window.QDCS_PAGE_MODE;
    const q = new URLSearchParams(location.search).get("mode");
    if (q === "teacher" || q === "student") return q;
    const path = (location.pathname || "").toLowerCase();
    if (path.endsWith("teacher.html")) return "teacher";
    if (path.endsWith("student.html")) return "student";
    // hash quiz code → student experience
    if (getShareFromUrl()) return "student";
    return "hub";
  }

  // ——— marking ———
  function norm(s) {
    return String(s || "")
      .trim()
      .toLowerCase()
      .replace(/\s+/g, " ");
  }

  function markQuestion(q, studentAns) {
    const marks = Number(q.marks) || 1;
    if (q.type === "mcq") {
      const ok = Number(studentAns) === Number(q.answer);
      return { score: ok ? marks : 0, max: marks, correct: ok };
    }
    if (q.type === "tf") {
      const sa = studentAns === true || studentAns === "true" || studentAns === "T" || studentAns === "是";
      const ok = sa === Boolean(q.answer);
      return { score: ok ? marks : 0, max: marks, correct: ok };
    }
    if (q.type === "fill") {
      const answers = Array.isArray(q.answer) ? q.answer : [q.answer];
      const n = norm(studentAns);
      const ok = answers.some((a) => norm(a) === n || (n && norm(a).includes(n) && n.length >= 2));
      // exact first; also accept if student matches one answer exactly after norm
      const exact = answers.some((a) => norm(a) === n);
      return { score: exact || ok ? marks : 0, max: marks, correct: exact || ok };
    }
    if (q.type === "sa") {
      const text = norm(studentAns);
      const kws = q.answerKeywords || (Array.isArray(q.answer) ? q.answer : [q.answer]).filter(Boolean);
      if (!text) return { score: 0, max: marks, correct: false, matched: [] };
      const matched = kws.filter((k) => text.includes(norm(k)));
      // half credit if ≥1 keyword, full if ≥2 or ≥ half of keywords
      const need = Math.max(1, Math.ceil(Math.min(2, kws.length) / 1));
      let ratio = 0;
      if (matched.length >= 2 || matched.length >= Math.ceil(kws.length / 2)) ratio = 1;
      else if (matched.length >= 1) ratio = 0.5;
      const score = Math.round(marks * ratio * 10) / 10;
      return { score, max: marks, correct: ratio === 1, partial: ratio === 0.5, matched };
    }
    return { score: 0, max: marks, correct: false };
  }

  // ——— import heuristics ———
  function parseImportText(text) {
    const lines = text.replace(/\r\n/g, "\n").split("\n");
    const chunks = [];
    let cur = [];
    const startRe = /^(?:Q\s*\d+|第\s*\d+\s*題|\d+[\.\)、]|[（(]\d+[）)]|\d+\s*[\.\)])\s*/i;

    function flush() {
      const body = cur.join("\n").trim();
      if (body) chunks.push(body);
      cur = [];
    }

    for (const line of lines) {
      if (startRe.test(line.trim()) && cur.length) flush();
      if (line.trim() || cur.length) cur.push(line);
    }
    flush();

    const questions = [];
    for (const chunk of chunks) {
      const q = heuristicQuestion(chunk);
      if (q) questions.push(q);
    }
    return questions;
  }

  function heuristicQuestion(chunk) {
    const lines = chunk.split("\n").map((l) => l.trim()).filter(Boolean);
    if (!lines.length) return null;
    let stemLine = lines[0].replace(/^(?:Q\s*\d+|第\s*\d+\s*題|\d+[\.\)、]|[（(]\d+[）)]|\d+\s*[\.\)])\s*/i, "");
    const rest = lines.slice(1);
    const optRe = /^(?:[A-Da-d][\.\)\、\s]|[（(][A-Da-d][）)])\s*(.*)$/;
    const options = [];
    const nonOpt = [];
    for (const r of rest) {
      const m = r.match(optRe);
      if (m) options.push(m[1] || m[0].replace(optRe, "$1"));
      else nonOpt.push(r);
    }

    // answer line
    let answerHint = "";
    const ansLine = nonOpt.find((l) => /^(答案|Answer|Ans)\s*[:：]/i.test(l));
    if (ansLine) answerHint = ansLine.replace(/^(答案|Answer|Ans)\s*[:：]\s*/i, "").trim();

    if (options.length >= 2) {
      let ansIdx = 0;
      if (answerHint) {
        const letter = answerHint.trim().toUpperCase().charAt(0);
        if (letter >= "A" && letter <= "D") ansIdx = letter.charCodeAt(0) - 65;
      }
      return {
        id: uid("q"),
        type: "mcq",
        stem: stemLine + (nonOpt.filter((l) => l !== ansLine).length ? "\n" + nonOpt.filter((l) => l !== ansLine).join("\n") : ""),
        options: options.slice(0, 6),
        answer: Math.min(ansIdx, options.length - 1),
        marks: 1,
        explanation: ""
      };
    }

    // T/F
    if (/[（(]?[Tt]rue\s*\/\s*[Ff]alse[）)]?|是非|對錯|T\s*\/\s*F/i.test(chunk) || /^(對|錯|是|非|True|False)\s*$/i.test(answerHint)) {
      let ans = true;
      if (/錯|非|False|F/i.test(answerHint)) ans = false;
      return { id: uid("q"), type: "tf", stem: stemLine, answer: ans, marks: 1, explanation: "" };
    }

    // fill: blanks ____ or （　）
    if (/_{2,}|（\s*）|\(\s*\)|【\s*】/.test(chunk)) {
      const fills = answerHint ? answerHint.split(/[/;,，、]/).map((s) => s.trim()).filter(Boolean) : [""];
      return { id: uid("q"), type: "fill", stem: stemLine + (rest.length ? "\n" + rest.join("\n") : ""), answer: fills.length ? fills : [""], marks: 1, explanation: "" };
    }

    // default short answer
    const kws = answerHint ? answerHint.split(/[/;,，、]/).map((s) => s.trim()).filter(Boolean) : [];
    return {
      id: uid("q"),
      type: "sa",
      stem: stemLine + (nonOpt.filter((l) => l !== ansLine).length ? "\n" + nonOpt.filter((l) => l !== ansLine).join("\n") : ""),
      answerKeywords: kws,
      marks: 2,
      explanation: ""
    };
  }

  // ——— builder state ———
  let editQuiz = null;

  function blankQuiz() {
    return {
      id: uid("quiz"),
      code: genCode(),
      title: "",
      subject: "綜合科學 / 生物",
      description: "",
      createdAt: new Date().toISOString(),
      questions: []
    };
  }

  function blankQuestion(type) {
    type = type || "mcq";
    const base = { id: uid("q"), type, stem: "", marks: 1, explanation: "" };
    if (type === "mcq") {
      base.options = ["", "", "", ""];
      base.answer = 0;
    } else if (type === "tf") {
      base.answer = true;
    } else if (type === "fill") {
      base.answer = [""];
    } else {
      base.answerKeywords = [];
      base.marks = 2;
    }
    return base;
  }

  function renderHome() {
    const map = loadQuizzes();
    const list = document.getElementById("home-quiz-list");
    const codes = Object.keys(map);
    if (!codes.length) {
      list.innerHTML = '<p class="muted">尚未有測驗。請到「教師建卷」建立，或載入示範卷 BIODEMO。</p>';
      return;
    }
    list.innerHTML = codes
      .map((c) => {
        const q = map[c];
        return `<div class="quiz-list-item">
          <div>
            <strong>${escapeHtml(q.title || c)}</strong>
            <span class="tag">${escapeHtml(c)}</span>
            <div class="muted">${(q.questions || []).length} 題 · ${escapeHtml(q.subject || "")}</div>
          </div>
          <div class="flex-gap">
            <button type="button" class="btn btn-sm btn-primary" data-take="${escapeHtml(c)}">學生作答</button>
            <button type="button" class="btn btn-sm" data-anal="${escapeHtml(c)}">成績</button>
          </div>
        </div>`;
      })
      .join("");
    list.querySelectorAll("[data-take]").forEach((b) =>
      b.addEventListener("click", () => openStudent(b.getAttribute("data-take")))
    );
    list.querySelectorAll("[data-anal]").forEach((b) => {
      b.addEventListener("click", () => {
        showPanel("analytics");
        document.getElementById("analytics-code").value = b.getAttribute("data-anal");
        renderAnalytics();
      });
    });
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function renderTeacherList() {
    const map = loadQuizzes();
    const el = document.getElementById("teacher-list");
    const codes = Object.keys(map);
    el.innerHTML =
      codes
        .map((c) => {
          const q = map[c];
          return `<div class="quiz-list-item">
          <div><strong>${escapeHtml(q.title || c)}</strong> <code>${escapeHtml(c)}</code>
          <div class="muted">${(q.questions || []).length} 題</div></div>
          <div class="flex-gap">
            <button type="button" class="btn btn-sm" data-edit="${escapeHtml(c)}">編輯</button>
            <button type="button" class="btn btn-sm" data-copy="${escapeHtml(c)}">複製連結</button>
            <button type="button" class="btn btn-sm btn-danger" data-del="${escapeHtml(c)}">刪除</button>
          </div></div>`;
        })
        .join("") || '<p class="muted">未有測驗。</p>';

    el.querySelectorAll("[data-edit]").forEach((b) =>
      b.addEventListener("click", () => startEdit(b.getAttribute("data-edit")))
    );
    el.querySelectorAll("[data-copy]").forEach((b) =>
      b.addEventListener("click", () => {
        const link = studentLink(b.getAttribute("data-copy"));
        navigator.clipboard.writeText(link).then(
          () => toast("已複製學生連結"),
          () => toast(link)
        );
      })
    );
    el.querySelectorAll("[data-del]").forEach((b) =>
      b.addEventListener("click", () => {
        const code = b.getAttribute("data-del");
        if (!confirm("確定刪除測驗 " + code + "？成績紀錄仍會保留。")) return;
        const m = loadQuizzes();
        delete m[code];
        saveQuizzes(m);
        renderTeacherList();
        toast("已刪除");
      })
    );
  }

  function startEdit(code) {
    const map = loadQuizzes();
    editQuiz = code && map[code] ? JSON.parse(JSON.stringify(map[code])) : blankQuiz();
    document.getElementById("builder-wrap").classList.remove("hidden");
    document.getElementById("bq-title").value = editQuiz.title || "";
    document.getElementById("bq-subject").value = editQuiz.subject || "";
    document.getElementById("bq-desc").value = editQuiz.description || "";
    document.getElementById("bq-code").textContent = editQuiz.code;
    renderBuilderQuestions();
    document.getElementById("builder-wrap").scrollIntoView({ behavior: "smooth" });
  }

  function renderBuilderQuestions() {
    const box = document.getElementById("builder-questions");
    if (!editQuiz.questions.length) {
      box.innerHTML = '<p class="muted">尚未加入題目。按「新增題目」或使用「簡化匯入」。</p>';
      return;
    }
    box.innerHTML = editQuiz.questions
      .map((q, i) => {
        const typeTag = `<span class="tag ${q.type}">${TYPE_LABEL[q.type] || q.type}</span>`;
        let body = "";
        if (q.type === "mcq") {
          body = (q.options || [])
            .map(
              (o, oi) => `<div class="opt-row">
              <input type="radio" name="ans_${i}" ${Number(q.answer) === oi ? "checked" : ""} data-qi="${i}" data-optans="${oi}" />
              <input type="text" value="${escapeHtml(o)}" data-qi="${i}" data-opt="${oi}" placeholder="選項 ${String.fromCharCode(65 + oi)}" />
            </div>`
            )
            .join("");
          body += `<button type="button" class="btn btn-sm" data-addopt="${i}">＋選項</button>`;
        } else if (q.type === "tf") {
          body = `<label><input type="radio" name="tf_${i}" data-qi="${i}" data-tf="true" ${q.answer ? "checked" : ""}/> 正確 True</label>
            <label style="margin-left:12px"><input type="radio" name="tf_${i}" data-qi="${i}" data-tf="false" ${!q.answer ? "checked" : ""}/> 錯誤 False</label>`;
        } else if (q.type === "fill") {
          const ans = Array.isArray(q.answer) ? q.answer.join(" / ") : q.answer || "";
          body = `<label class="field">可接受答案（以 / 分隔）<input type="text" data-qi="${i}" data-fillans value="${escapeHtml(ans)}" /></label>`;
        } else {
          const kws = (q.answerKeywords || []).join(" / ");
          body = `<label class="field">關鍵詞 keywords（以 / 分隔，自動評分用）<input type="text" data-qi="${i}" data-sakw value="${escapeHtml(kws)}" /></label>`;
        }
        return `<div class="q-block" data-qi="${i}">
          <div class="q-head">
            <span class="q-num">Q${i + 1}</span>${typeTag}
            <label>分數 <input type="number" min="0.5" step="0.5" style="width:64px" data-qi="${i}" data-marks value="${q.marks}" /></label>
            <button type="button" class="btn btn-sm btn-danger" data-rmq="${i}">刪題</button>
            <button type="button" class="btn btn-sm" data-upq="${i}" ${i === 0 ? "disabled" : ""}>↑</button>
            <button type="button" class="btn btn-sm" data-dnq="${i}" ${i === editQuiz.questions.length - 1 ? "disabled" : ""}>↓</button>
          </div>
          <label class="field">題幹
            <textarea data-qi="${i}" data-stem rows="2">${escapeHtml(q.stem)}</textarea>
          </label>
          ${body}
          <label class="field">解析（選填）
            <input type="text" data-qi="${i}" data-expl value="${escapeHtml(q.explanation || "")}" />
          </label>
        </div>`;
      })
      .join("");

    box.querySelectorAll("[data-stem]").forEach((el) =>
      el.addEventListener("input", () => {
        editQuiz.questions[+el.dataset.qi].stem = el.value;
      })
    );
    box.querySelectorAll("[data-marks]").forEach((el) =>
      el.addEventListener("change", () => {
        editQuiz.questions[+el.dataset.qi].marks = Number(el.value) || 1;
      })
    );
    box.querySelectorAll("[data-expl]").forEach((el) =>
      el.addEventListener("input", () => {
        editQuiz.questions[+el.dataset.qi].explanation = el.value;
      })
    );
    box.querySelectorAll("[data-opt]").forEach((el) =>
      el.addEventListener("input", () => {
        editQuiz.questions[+el.dataset.qi].options[+el.dataset.opt] = el.value;
      })
    );
    box.querySelectorAll("[data-optans]").forEach((el) =>
      el.addEventListener("change", () => {
        if (el.checked) editQuiz.questions[+el.dataset.qi].answer = +el.dataset.optans;
      })
    );
    box.querySelectorAll("[data-tf]").forEach((el) =>
      el.addEventListener("change", () => {
        if (el.checked) editQuiz.questions[+el.dataset.qi].answer = el.dataset.tf === "true";
      })
    );
    box.querySelectorAll("[data-fillans]").forEach((el) =>
      el.addEventListener("input", () => {
        editQuiz.questions[+el.dataset.qi].answer = el.value.split("/").map((s) => s.trim()).filter(Boolean);
      })
    );
    box.querySelectorAll("[data-sakw]").forEach((el) =>
      el.addEventListener("input", () => {
        editQuiz.questions[+el.dataset.qi].answerKeywords = el.value.split("/").map((s) => s.trim()).filter(Boolean);
      })
    );
    box.querySelectorAll("[data-rmq]").forEach((el) =>
      el.addEventListener("click", () => {
        editQuiz.questions.splice(+el.dataset.rmq, 1);
        renderBuilderQuestions();
      })
    );
    box.querySelectorAll("[data-upq]").forEach((el) =>
      el.addEventListener("click", () => {
        const i = +el.dataset.upq;
        if (i <= 0) return;
        const t = editQuiz.questions[i - 1];
        editQuiz.questions[i - 1] = editQuiz.questions[i];
        editQuiz.questions[i] = t;
        renderBuilderQuestions();
      })
    );
    box.querySelectorAll("[data-dnq]").forEach((el) =>
      el.addEventListener("click", () => {
        const i = +el.dataset.dnq;
        if (i >= editQuiz.questions.length - 1) return;
        const t = editQuiz.questions[i + 1];
        editQuiz.questions[i + 1] = editQuiz.questions[i];
        editQuiz.questions[i] = t;
        renderBuilderQuestions();
      })
    );
    box.querySelectorAll("[data-addopt]").forEach((el) =>
      el.addEventListener("click", () => {
        const q = editQuiz.questions[+el.dataset.addopt];
        q.options = q.options || [];
        q.options.push("");
        renderBuilderQuestions();
      })
    );
  }

  function saveCurrentQuiz() {
    if (!editQuiz) return;
    editQuiz.title = document.getElementById("bq-title").value.trim() || "未命名測驗";
    editQuiz.subject = document.getElementById("bq-subject").value.trim();
    editQuiz.description = document.getElementById("bq-desc").value.trim();
    editQuiz.updatedAt = new Date().toISOString();
    const map = loadQuizzes();
    map[editQuiz.code] = editQuiz;
    saveQuizzes(map);
    const link = studentLink(editQuiz.code);
    document.getElementById("share-area").innerHTML = `
      <div class="share-box">
        <div><strong>分享碼 Share code：</strong> <code>${escapeHtml(editQuiz.code)}</code></div>
        <div style="margin-top:6px"><strong>學生連結：</strong><br/><code id="share-link">${escapeHtml(link)}</code></div>
        <div class="flex-gap" style="margin-top:8px">
          <button type="button" class="btn btn-sm btn-primary" id="btn-copy-link">複製連結</button>
          <button type="button" class="btn btn-sm" id="btn-preview-stu">預覽作答</button>
        </div>
        <p class="muted" style="margin:8px 0 0">注意：資料存於本機瀏覽器 localStorage。學生須在<strong>同一瀏覽器設定檔</strong>開啟，或教師先匯出 JSON 給學生匯入。跨裝置需手動匯出／匯入（見 README）。</p>
      </div>`;
    document.getElementById("btn-copy-link").onclick = () => {
      navigator.clipboard.writeText(link).then(() => toast("已複製"), () => toast(link));
    };
    document.getElementById("btn-preview-stu").onclick = () => openStudent(editQuiz.code);
    toast("已儲存測驗 " + editQuiz.code);
    renderTeacherList();
  }

  // ——— student ———
  function openStudent(code) {
    code = (code || "").toUpperCase();
    const map = loadQuizzes();
    const quiz = map[code];
    if (!quiz) {
      toast("找不到測驗碼：" + code);
      return;
    }
    showPanel("student");
    const root = document.getElementById("student-root");
    const totalMarks = (quiz.questions || []).reduce((s, q) => s + (Number(q.marks) || 0), 0);
    root.innerHTML = `
      <div class="card tone-green">
        <h2><span class="dot green"></span>${escapeHtml(quiz.title)}</h2>
        <p class="muted">${escapeHtml(quiz.subject || "")} · 碼 ${escapeHtml(code)} · 滿分 ${totalMarks}</p>
        <p>${escapeHtml(quiz.description || "")}</p>
        <p class="muted"><a href="../hydrostatic-osmotic-pressure.html" target="_blank" rel="noopener">相關模擬器（紫區亦可開）</a></p>
        <label class="field">姓名／班號 Name <input type="text" id="stu-name" placeholder="例如：3A-12 Chan Tai Man" /></label>
        <div id="stu-form"></div>
        <div class="flex-gap" style="margin-top:12px">
          <button type="button" class="btn btn-primary" id="btn-submit-quiz">提交並自動評分 Submit</button>
        </div>
        <div id="stu-result" class="hidden"></div>
      </div>`;
    const form = document.getElementById("stu-form");
    form.innerHTML = (quiz.questions || [])
      .map((q, i) => {
        let inputs = "";
        if (q.type === "mcq") {
          inputs = (q.options || [])
            .map(
              (o, oi) =>
                `<label class="choice-label"><input type="radio" name="sq_${i}" value="${oi}" /> <span>${String.fromCharCode(65 + oi)}. ${escapeHtml(o)}</span></label>`
            )
            .join("");
        } else if (q.type === "tf") {
          inputs = `<label class="choice-label"><input type="radio" name="sq_${i}" value="true" /> 正確 True</label>
            <label class="choice-label"><input type="radio" name="sq_${i}" value="false" /> 錯誤 False</label>`;
        } else if (q.type === "fill") {
          inputs = `<input type="text" class="field-input" id="sq_${i}" placeholder="填寫答案" />`;
        } else {
          inputs = `<textarea class="field-textarea" id="sq_${i}" rows="3" placeholder="短答（關鍵詞自動評分，僅供參考）"></textarea>`;
        }
        return `<div class="student-q" id="sqwrap_${i}">
          <div class="stem">Q${i + 1}. ${escapeHtml(q.stem).replace(/\n/g, "<br/>")}
            <span class="tag ${q.type}">${TYPE_LABEL[q.type]}</span>
            <span class="muted">（${q.marks} 分）</span>
          </div>
          ${inputs}
        </div>`;
      })
      .join("");

    document.getElementById("btn-submit-quiz").onclick = () => {
      const name = document.getElementById("stu-name").value.trim() || "匿名 Anonymous";
      const answers = [];
      let score = 0;
      let max = 0;
      const details = [];
      quiz.questions.forEach((q, i) => {
        let ans;
        if (q.type === "mcq" || q.type === "tf") {
          const sel = form.querySelector(`input[name="sq_${i}"]:checked`);
          ans = sel ? (q.type === "tf" ? sel.value === "true" : Number(sel.value)) : null;
        } else {
          const el = document.getElementById("sq_" + i);
          ans = el ? el.value : "";
        }
        answers.push(ans);
        const m = markQuestion(q, ans);
        score += m.score;
        max += m.max;
        details.push(m);
      });
      const attempt = {
        id: uid("att"),
        code,
        name,
        answers,
        details,
        score,
        max,
        percent: max ? Math.round((score / max) * 1000) / 10 : 0,
        at: new Date().toISOString()
      };
      const attempts = loadAttempts();
      attempts.push(attempt);
      saveAttempts(attempts);

      // show feedback
      const res = document.getElementById("stu-result");
      res.classList.remove("hidden");
      const pass = attempt.percent >= 50;
      res.innerHTML = `<div class="result-banner ${pass ? "pass" : "review"}">
        得分 Score：${score} / ${max}（${attempt.percent}%）— ${escapeHtml(name)}
      </div>`;
      quiz.questions.forEach((q, i) => {
        const wrap = document.getElementById("sqwrap_" + i);
        const d = details[i];
        let fb = `<div class="muted" style="margin-top:6px">本題：${d.score}/${d.max}`;
        if (d.partial) fb += "（部分分數）";
        if (q.explanation) fb += " · " + escapeHtml(q.explanation);
        fb += "</div>";
        wrap.insertAdjacentHTML("beforeend", fb);
        if (q.type === "mcq" || q.type === "tf") {
          wrap.querySelectorAll(".choice-label").forEach((lab) => {
            const inp = lab.querySelector("input");
            const val = q.type === "tf" ? String(q.answer) : String(q.answer);
            if (inp.value === val) lab.classList.add("correct-mark");
            else if (inp.checked && !d.correct) lab.classList.add("wrong-mark");
          });
        }
      });
      document.getElementById("btn-submit-quiz").disabled = true;
      toast("已提交並儲存成績");
      res.scrollIntoView({ behavior: "smooth" });
    };
  }

  function renderAnalytics() {
    const code = document.getElementById("analytics-code").value;
    const out = document.getElementById("analytics-out");
    if (!code) {
      out.innerHTML = '<p class="muted">請選擇測驗。</p>';
      return;
    }
    const map = loadQuizzes();
    const quiz = map[code];
    if (!quiz) {
      out.innerHTML = '<p class="muted">測驗不存在。</p>';
      return;
    }
    const attempts = loadAttempts().filter((a) => a.code === code);
    if (!attempts.length) {
      out.innerHTML = '<p class="muted">尚無作答紀錄。請先以學生模式提交一次。</p>';
      return;
    }
    const avg = attempts.reduce((s, a) => s + a.percent, 0) / attempts.length;
    const nQ = (quiz.questions || []).length;
    const perQ = [];
    for (let i = 0; i < nQ; i++) {
      let ok = 0;
      let total = 0;
      attempts.forEach((a) => {
        const d = (a.details || [])[i];
        if (!d) return;
        total++;
        if (d.score >= d.max * 0.99) ok++;
        else if (d.score > 0) ok += 0.5; // partial counts half toward %
      });
      perQ.push(total ? Math.round((ok / total) * 1000) / 10 : 0);
    }

    out.innerHTML = `
      <div class="stat-row">
        <div class="stat-pill"><div class="val">${attempts.length}</div><div class="lbl">作答人次 Attempts</div></div>
        <div class="stat-pill"><div class="val">${avg.toFixed(1)}%</div><div class="lbl">班平均 Class average</div></div>
        <div class="stat-pill"><div class="val">${nQ}</div><div class="lbl">題數 Questions</div></div>
      </div>
      <h3>各題正確率 Per-question % correct</h3>
      <div class="chart-wrap"><canvas id="chart-bar" width="640" height="280"></canvas></div>
      <h3>個別成績</h3>
      <div class="table-wrap"><table class="scores">
        <thead><tr><th>時間</th><th>姓名</th><th>得分</th><th>%</th></tr></thead>
        <tbody>
          ${attempts
            .slice()
            .reverse()
            .map((a) => {
              const t = formatHK(a.at);
              return `<tr><td>${escapeHtml(t)}</td><td>${escapeHtml(a.name)}</td><td>${a.score}/${a.max}</td><td>${a.percent}%</td></tr>`;
            })
            .join("")}
        </tbody>
      </table></div>
      <div class="flex-gap" style="margin-top:10px">
        <button type="button" class="btn btn-sm btn-danger" id="btn-clear-attempts">清除此卷成績</button>
      </div>`;

    drawBarChart(document.getElementById("chart-bar"), perQ);
    document.getElementById("btn-clear-attempts").onclick = () => {
      if (!confirm("清除測驗 " + code + " 的所有成績？")) return;
      saveAttempts(loadAttempts().filter((a) => a.code !== code));
      renderAnalytics();
      toast("已清除");
    };
  }

  function formatHK(iso) {
    try {
      return new Date(iso).toLocaleString("zh-HK", { timeZone: "Asia/Hong_Kong" });
    } catch (e) {
      return iso;
    }
  }

  function drawBarChart(canvas, values) {
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const W = canvas.width;
    const H = canvas.height;
    ctx.clearRect(0, 0, W, H);
    const pad = { t: 24, r: 16, b: 40, l: 40 };
    const plotW = W - pad.l - pad.r;
    const plotH = H - pad.t - pad.b;
    const n = values.length || 1;
    const gap = 8;
    const barW = Math.max(12, (plotW - gap * n) / n);

    // axes
    ctx.strokeStyle = "#c0cad6";
    ctx.beginPath();
    ctx.moveTo(pad.l, pad.t);
    ctx.lineTo(pad.l, pad.t + plotH);
    ctx.lineTo(pad.l + plotW, pad.t + plotH);
    ctx.stroke();

    // grid 0-100
    ctx.fillStyle = "#5a6a7a";
    ctx.font = "11px sans-serif";
    [0, 25, 50, 75, 100].forEach((v) => {
      const y = pad.t + plotH - (v / 100) * plotH;
      ctx.strokeStyle = "#e8eef4";
      ctx.beginPath();
      ctx.moveTo(pad.l, y);
      ctx.lineTo(pad.l + plotW, y);
      ctx.stroke();
      ctx.fillText(v + "%", 4, y + 4);
    });

    values.forEach((v, i) => {
      const h = (Math.min(100, Math.max(0, v)) / 100) * plotH;
      const x = pad.l + gap / 2 + i * (barW + gap);
      const y = pad.t + plotH - h;
      ctx.fillStyle = v >= 70 ? "#2e7d32" : v >= 40 ? "#1a5f7a" : "#c62828";
      ctx.fillRect(x, y, barW, h);
      ctx.fillStyle = "#1a2332";
      ctx.font = "11px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("Q" + (i + 1), x + barW / 2, pad.t + plotH + 16);
      ctx.fillText(v + "%", x + barW / 2, y - 4);
      ctx.textAlign = "left";
    });
  }

  // ——— export / import JSON + Drive-friendly downloads (no browser OAuth) ———
  function hkDateStamp() {
    try {
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Hong_Kong",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).formatToParts(new Date());
      const get = (t) => parts.find((p) => p.type === t).value;
      return get("year") + "-" + get("month") + "-" + get("day");
    } catch (e) {
      return new Date().toISOString().slice(0, 10);
    }
  }

  /** ASCII-safe, Drive-friendly file stem (no spaces/slashes). */
  function driveSafeStem(code, kind) {
    const c = String(code || "QUIZ")
      .toUpperCase()
      .replace(/[^A-Z0-9_-]/g, "")
      .slice(0, 24) || "QUIZ";
    const k = String(kind || "data").replace(/[^a-z0-9_-]/gi, "");
    return "QDCS-lite_" + c + "_" + k + "_" + hkDateStamp();
  }

  function downloadBlob(filename, blob) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function resolveQuizForExport() {
    const sel = document.getElementById("drive-export-code");
    const codeFromDrive = sel && sel.value;
    const code =
      (editQuiz && editQuiz.code) ||
      codeFromDrive ||
      (document.getElementById("analytics-code") && document.getElementById("analytics-code").value);
    const map = loadQuizzes();
    if (editQuiz && (!codeFromDrive || codeFromDrive === editQuiz.code)) return editQuiz;
    return code ? map[code] : null;
  }

  function exportQuizJson() {
    const q = resolveQuizForExport();
    if (!q) {
      toast("請先選擇或儲存測驗");
      return;
    }
    const name = driveSafeStem(q.code, "quiz") + ".json";
    const payload = Object.assign({}, q, {
      _exportMeta: {
        app: "QDCS-lite",
        exportedAt: new Date().toISOString(),
        timezoneNote: "Asia/Hong_Kong",
        driveHint: "Upload this JSON to Google Drive via assistant or manual upload; site has no OAuth."
      }
    });
    downloadBlob(name, new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" }));
    toast("已下載 " + name);
    updateDriveFilenameHint(q.code);
  }

  function csvEscape(v) {
    const s = String(v == null ? "" : v);
    if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  function exportAttemptsCsv() {
    const q = resolveQuizForExport();
    if (!q) {
      toast("請先選擇測驗");
      return;
    }
    const attempts = loadAttempts().filter((a) => a.code === q.code);
    const nQ = (q.questions || []).length;
    const headers = ["exportedAt_HK", "attemptAt", "code", "name", "score", "max", "percent"];
    for (let i = 0; i < nQ; i++) headers.push("Q" + (i + 1) + "_score");
    const rows = [headers.join(",")];
    const exportedAt = formatHK(new Date().toISOString());
    if (!attempts.length) {
      rows.push([csvEscape(exportedAt), "", csvEscape(q.code), "(no attempts yet)", "0", "0", "0"].join(","));
    } else {
      attempts.forEach((a) => {
        const cells = [
          csvEscape(exportedAt),
          csvEscape(formatHK(a.at)),
          csvEscape(a.code),
          csvEscape(a.name),
          a.score,
          a.max,
          a.percent
        ];
        for (let i = 0; i < nQ; i++) {
          const d = (a.details || [])[i];
          cells.push(d ? d.score : "");
        }
        rows.push(cells.map(csvEscape).join(","));
      });
    }
    const name = driveSafeStem(q.code, "attempts") + ".csv";
    downloadBlob(name, new Blob(["\ufeff" + rows.join("\n")], { type: "text/csv;charset=utf-8" }));
    toast("已下載 " + name + "（" + attempts.length + " 筆）");
    updateDriveFilenameHint(q.code);
  }

  function exportDriveReadme() {
    const q = resolveQuizForExport();
    const code = q ? q.code : "QUIZCODE";
    const quizName = driveSafeStem(code, "quiz") + ".json";
    const csvName = driveSafeStem(code, "attempts") + ".csv";
    const text =
      "QDCS-lite → Google Drive workflow (MVP)\n" +
      "=====================================\n\n" +
      "This static site CANNOT call your Google Drive from the browser (no OAuth).\n" +
      "Teacher steps:\n" +
      "1. Download " + quizName + " (quiz JSON)\n" +
      "2. Optional: download " + csvName + " (attempts for Sheets)\n" +
      "3. Upload files to Drive yourself, OR ask workshop AI / Grok Bot to upload the package folder.\n\n" +
      "Suggested Drive folder name: QDCS-lite_exports\n" +
      "Site package folder on disk: simulators/qdcs-lite/ (or drive-export/ snapshot)\n\n" +
      "Do not expect a Sign in with Google button inside index.html for this MVP.\n";
    const name = driveSafeStem(code, "DRIVE-README") + ".txt";
    downloadBlob(name, new Blob([text], { type: "text/plain;charset=utf-8" }));
    toast("已下載 " + name);
  }

  function importQuizJsonFile(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const q = JSON.parse(reader.result);
        if (!q.code || !q.questions) throw new Error("格式不符");
        const map = loadQuizzes();
        map[q.code] = q;
        saveQuizzes(map);
        toast("已匯入測驗 " + q.code);
        renderHome();
        renderTeacherList();
      } catch (e) {
        toast("JSON 無效：" + e.message);
      }
    };
    reader.readAsText(file);
  }

  // ——— mammoth optional ———
  function loadDocx(file) {
    if (typeof mammoth === "undefined") {
      toast("mammoth.js 未載入，請改用貼上文字");
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      mammoth
        .extractRawText({ arrayBuffer: reader.result })
        .then((res) => {
          document.getElementById("import-text").value = res.value || "";
          toast("已擷取 .docx 文字（僅純文字，無 OCR）");
          runImport();
        })
        .catch(() => toast("無法讀取 docx"));
    };
    reader.readAsArrayBuffer(file);
  }

    }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();

</script>
